# Image factory schematic for the Raspberry Pi 4 nodes.
#
# The overlay is the load-bearing part: an arm64 Pi will not boot an image built
# without siderolabs/sbc-raspberrypi. basement-rpi4-peach is currently pointed at
# the x86 worker schematic and so has no overlay — see docs/ISSUES.md #9 for the
# fix, which needs the age key.
#
# Trimmed 2026-08-10: siderolabs/nut-client was declared here but nothing in the
# repo or the cluster uses it — there is no NUT server, no upsd, no UPS
# monitoring of any kind. Dropping it also means peach can safely share this file
# with chocolate. See docs/ISSUES.md #11.
#
# No extraKernelArgs here, deliberately: net.ifnames=0 is not needed because
# interface selection on these nodes matches on bus path, not interface name
# (all/20-link-alias.yaml.tpl).
overlay:
  image: siderolabs/sbc-raspberrypi
  name: rpi_generic
customization: {}
