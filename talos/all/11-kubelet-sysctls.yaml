# Unsafe sysctls pods may set. Kept out of 03-kubelet.yaml.tpl so the list is
# easy to find; Talos merges both patches into one machine.kubelet.extraConfig.
#
# Deliberately a machine.kubelet patch rather than the KubeletConfig document
# this was adapted from (joryirving/home-ops): that one also pins a kubelet
# image, and topf.yaml's kubernetesVersion must stay the only place that does.
machine:
  kubelet:
    extraConfig:
      allowedUnsafeSysctls:
        # matter-server: accept Thread border-router route advertisements on its
        # multus interface (net1). See
        # kubernetes/apps/home-automation/matter-server/app/helmrelease.yaml.
        - net.ipv6.conf.net1.accept_ra_rt_info_max_plen
