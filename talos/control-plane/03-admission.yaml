# Disable default API server admission plugins. Under talhelper this was an
# RFC-6902 `op: remove`, which Talos v1.13 rejects for multi-document machine
# configuration; the strategic-merge equivalent is `$patch: delete`.
#
# `disablePodSecurityPolicy` is likewise present on the running control-plane
# nodes but absent from talconfig.yaml. Carried here so applying topf is not a
# behaviour change. See docs/ISSUES.md #10.
cluster:
  apiServer:
    disablePodSecurityPolicy: true
    admissionControl:
      $patch: delete
