---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    replicaCount: 2
    # Spread the two controller replicas across nodes so a single node going
    # away doesn't take secret syncing with it. Set on `global` so the chart
    # applies it to the controller, webhook and cert-controller alike, each
    # with its own component selector filled in — a hand-written labelSelector
    # here could only ever match one of the three.
    global:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Ignore the outgoing revision's pods during a rollout; without this
          # the old and new pod count together and the new one can't be placed.
          matchLabelKeys:
            - pod-template-hash
    serviceMonitor:
      enabled: true
      interval: 1m
    webhook:
      serviceMonitor:
        enabled: true
        interval: 1m
    certController:
      serviceMonitor:
        enabled: true
        interval: 1m
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        cpu: 100m
        memory: 256Mi
