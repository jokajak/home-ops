---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# MyGarage's role on the SHARED database/postgres cluster. The role is ours to
# create, so the credential lives in Bitwarden ("mygarage pgcreds", a login
# item) and postgres-init reconciles the role against it on every start — which
# also means rotating the password in Bitwarden actually takes effect rather
# than locking the app out. Same shape as vikunja and paperless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mygarage-pg
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: mygarage-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # MyGarage takes a single SQLAlchemy URL, not host/user/pass parts, so
        # the credential has to be assembled here. urlquery-escaped because the
        # generated password carries `+=,~` — SQLAlchemy percent-decodes the
        # userinfo, so escaping round-trips cleanly. Same treatment as the
        # litellm DATABASE_URL in ai/hearthai.
        MYGARAGE_DATABASE_URL: >-
          postgresql+asyncpg://{{ .pg_username | urlquery }}:{{ .pg_password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/mygarage
        # Consumed by the postgres-init initContainer
        INIT_POSTGRES_DBNAME: mygarage
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: pg_username
      remoteRef:
        key: mygarage pgcreds
        property: username
    - secretKey: pg_password
      remoteRef:
        key: mygarage pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # MyGarage itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      remoteRef:
        key: cloudnative_pg credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Signs MyGarage's session JWTs *and* encrypts the settings rows the app marks
# `encrypted` — the OIDC client secret among them.
#
# Left unset the app mints one on first boot into /data/secret.key, which
# quietly couples two independent recovery paths: the encrypted settings are in
# Postgres (barman-cloud -> MinIO) while the key would be on the NFS claim
# (volsync -> MinIO). Restore one without the other and the OIDC config is
# undecryptable. Pinning it from Bitwarden breaks that coupling, so the key
# survives a rebuild of either side. Write-once: rotating it logs everyone out
# and orphans every encrypted setting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mygarage-fields
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: mygarage-fields-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MYGARAGE_SECRET_KEY: "{{ .secret_key }}"
  refreshInterval: 1h
  data:
    - secretKey: secret_key
      remoteRef:
        key: mygarage credentials
        property: secret_key
