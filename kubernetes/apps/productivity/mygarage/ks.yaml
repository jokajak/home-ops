---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-mygarage
  namespace: flux-system
spec:
  targetNamespace: productivity
  interval: 10m
  path: "./kubernetes/apps/productivity/mygarage/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: mygarage
      GATUS_SUBDOMAIN: garage
      # The app-template claim for the `data` persistence key. Vehicle,
      # service and fuel records live in Postgres (backed up by CNPG ->
      # MinIO); this volume holds uploaded photos, attachments, documents
      # and the JWT/settings-encryption key file.
      VOLSYNC_CLAIM: mygarage-data
      VOLSYNC_CAPACITY: 10Gi
      # the image runs directly as uid 1000 (`mygarage`) with no internal
      # remapping, so the restic mover reads the tree as the same user
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cluster-apps-external-secrets
    # The shared cluster, not the operator: mygarage has no CNPG resources of
    # its own, it just needs postgres-rw answering before init-db runs.
    - name: cluster-apps-cloudnative-pg-cluster
    - name: cluster-apps-csi-driver-nfs
