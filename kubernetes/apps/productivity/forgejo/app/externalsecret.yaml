---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Forgejo's role on the SHARED database/postgres cluster.
#
# Forgejo used to run its own two-instance CNPG cluster, which minted this
# credential itself (forgejo-database-app). On the shared cluster the role is
# ours to create, so the credential lives in Bitwarden ("forgejo pgcreds", a
# login item) and postgres-init reconciles the role against it on every start —
# which also means rotating the password in Bitwarden actually takes effect
# rather than locking the app out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-pg
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: forgejo-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the chart's additionalConfigFromEnvs (FORGEJO__DATABASE__*)
        username: "{{ .pg_username }}"
        password: "{{ .pg_password }}"
        # Consumed by the injected postgres-init initContainer
        INIT_POSTGRES_DBNAME: forgejo
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: pg_username
      remoteRef:
        key: forgejo pgcreds
        property: username
    - secretKey: pg_password
      remoteRef:
        key: forgejo pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # Forgejo itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      remoteRef:
        key: cloudnative_pg credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Local admin bootstrapped on first start — the break-glass login if Authentik
# is unavailable (terraform/bitwarden -> "forgejo credentials"). The chart reads
# `username` and `password` from this secret (gitea.admin.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: forgejo-admin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .admin_user }}"
        password: "{{ .admin_password }}"
  refreshInterval: 1h
  data:
    - secretKey: admin_user
      remoteRef:
        key: forgejo credentials
        property: username
    - secretKey: admin_password
      remoteRef:
        key: forgejo credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client. The chart wires these into GITEA_OAUTH_KEY_0 /
# GITEA_OAUTH_SECRET_0 for `forgejo admin auth add-oauth`, and insists on the
# key names `key` and `secret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: forgejo-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .client_id }}"
        secret: "{{ .client_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-forgejo
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-forgejo
        property: password
