---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# MinIO S3 credentials for the shared `databases` bucket, consumed by the CNPG
# barman-cloud ObjectStore (terraform/minio -> minio-tf-databases).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-forgejo-pgsql
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        minio_s3_access_key: |-
          {{ .minio_user }}
        minio_s3_secret_access_key: |-
          {{ .minio_secret }}
  refreshInterval: 15m
  data:
    - secretKey: minio_user
      remoteRef:
        key: minio-tf-databases
        property: username
    - secretKey: minio_secret
      remoteRef:
        key: minio-tf-databases
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Local admin bootstrapped on first start — the break-glass login if Authentik
# is unavailable (terraform/bitwarden -> "forgejo credentials"). The chart reads
# `username` and `password` from this secret (gitea.admin.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: forgejo-admin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .admin_user }}"
        password: "{{ .admin_password }}"
  refreshInterval: 1h
  data:
    - secretKey: admin_user
      remoteRef:
        key: forgejo credentials
        property: username
    - secretKey: admin_password
      remoteRef:
        key: forgejo credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client. The chart wires these into GITEA_OAUTH_KEY_0 /
# GITEA_OAUTH_SECRET_0 for `forgejo admin auth add-oauth`, and insists on the
# key names `key` and `secret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: forgejo-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .client_id }}"
        secret: "{{ .client_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-forgejo
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-forgejo
        property: password
