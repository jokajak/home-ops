---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo
  namespace: flux-system
spec:
  targetNamespace: productivity
  interval: 10m
  path: "./kubernetes/apps/productivity/forgejo/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: forgejo
      GATUS_SUBDOMAIN: git
      # the rootless image runs directly as this uid/gid with no internal
      # remapping, so the restic mover reads the NFS tree as the same user
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cluster-apps-external-secrets
    # The shared cluster, not the operator: forgejo has no CNPG resources of its
    # own any more, it just needs postgres-rw answering before init-db runs.
    - name: cluster-apps-cloudnative-pg-cluster
    - name: dragonfly-cluster
    - name: cluster-apps-csi-driver-nfs
