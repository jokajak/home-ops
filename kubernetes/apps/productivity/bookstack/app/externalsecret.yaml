---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Server-side MariaDB credentials. Deliberately a separate Secret from
# bookstack-db-secret below even though both read the same Bitwarden item: the
# root password is needed by the database container and the dump CronJob, and
# there is no reason for it to appear in the application pod's environment.
#
# NOTE: the official mariadb image only reads MARIADB_* on an EMPTY datadir. It
# creates the database and role once, on first start, and ignores these on
# every start after that — unlike postgres-init, which reconciles. Rotating the
# password in Bitwarden therefore does NOT rotate it in MariaDB; that is a
# manual ALTER USER. See the plan doc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstack-mariadb
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bookstack-mariadb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MARIADB_DATABASE: bookstack
        MARIADB_USER: "{{ .db_username }}"
        MARIADB_PASSWORD: "{{ .db_password }}"
        MARIADB_ROOT_PASSWORD: "{{ .db_root_password }}"
  refreshInterval: 1h
  data:
    - secretKey: db_username
      remoteRef:
        key: bookstack dbcreds
        property: username
    - secretKey: db_password
      remoteRef:
        key: bookstack dbcreds
        property: password
    - secretKey: db_root_password
      # A custom field on the item rather than a login property, so this one key
      # reads from the fields store. Same override `authentik` uses for
      # secret_key; without it the whole ExternalSecret fails to resolve.
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: bookstack dbcreds
        property: root_password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The same role, as the application sees it. BookStack reads DB_* from its env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstack-db
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bookstack-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_DATABASE: bookstack
        DB_USERNAME: "{{ .db_username }}"
        DB_PASSWORD: "{{ .db_password }}"
  refreshInterval: 1h
  data:
    - secretKey: db_username
      remoteRef:
        key: bookstack dbcreds
        property: username
    - secretKey: db_password
      remoteRef:
        key: bookstack dbcreds
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Laravel APP_KEY. Encrypts session cookies and anything BookStack stores
# encrypted, so rotating it logs everyone out; treat it as write-once. Custom
# field on the Bitwarden item, hence the `bitwarden-fields` store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstack-fields
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: bookstack-fields-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        APP_KEY: "{{ .app_key }}"
  refreshInterval: 1h
  data:
    - secretKey: app_key
      remoteRef:
        key: bookstack credentials
        property: app_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client. BookStack discovers the rest of the endpoints from
# OIDC_ISSUER, so only the client pair is secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstack-oidc
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bookstack-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-bookstack
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-bookstack
        property: password
