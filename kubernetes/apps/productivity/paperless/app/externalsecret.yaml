---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Paperless's role on the SHARED database/postgres cluster.
#
# Paperless used to run its own two-instance CNPG cluster, which minted this
# credential itself (paperless-database-app). On the shared cluster the role is
# ours to create, so the credential lives in Bitwarden ("paperless pgcreds", a
# login item) and postgres-init reconciles the role against it on every start —
# which also means rotating the password in Bitwarden actually takes effect
# rather than locking the app out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-pg
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: paperless-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Read straight into the app's env (PAPERLESS_DBHOST/NAME are plain
        # values in the HelmRelease — only the credential is secret).
        PAPERLESS_DBUSER: "{{ .pg_username }}"
        PAPERLESS_DBPASS: "{{ .pg_password }}"
        # Consumed by the postgres-init initContainer
        INIT_POSTGRES_DBNAME: paperless
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: pg_username
      remoteRef:
        key: paperless pgcreds
        property: username
    - secretKey: pg_password
      remoteRef:
        key: paperless pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # Paperless itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      remoteRef:
        key: cloudnative_pg credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Local superuser bootstrapped on first start — the fallback login if Authentik
# is unavailable (terraform/bitwarden -> "paperless credentials").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-admin
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: paperless-admin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_ADMIN_USER: "{{ .admin_user }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .admin_password }}"
  refreshInterval: 1h
  data:
    - secretKey: admin_user
      remoteRef:
        key: paperless credentials
        property: username
    - secretKey: admin_password
      remoteRef:
        key: paperless credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Django SECRET_KEY. Lives as a custom field on the same Bitwarden item, so it
# needs the `bitwarden-fields` store rather than `bitwarden-login`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-fields
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: paperless-fields-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"
  refreshInterval: 1h
  data:
    - secretKey: secret_key
      remoteRef:
        key: paperless credentials
        property: secret_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client. django-allauth takes its whole provider config as one
# JSON blob, so it is assembled here — the client secret never lands in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: paperless-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
          {"openid_connect": {"APPS": [{"provider_id": "authentik",
          "name": "Authentik",
          "client_id": "{{ .client_id }}",
          "secret": "{{ .client_secret }}",
          "settings": {"server_url":
          "https://auth.${SECRET_DOMAIN:=internal}/application/o/paperless-provider/.well-known/openid-configuration"}}]}}
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-paperless
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-paperless
        property: password
