---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: productivity
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      paperless:
        # single writer against the NFS document tree and the Tantivy index
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Creates the paperless database and role on the shared cluster if
          # they are not there yet, then does nothing on every subsequent start.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom:
              - secretRef:
                  name: paperless-pg-secret
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              # NOTE: ghcr image tags have no "v" prefix, unlike the GitHub release tag
              tag: 3.1.3
            env:
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN:=internal}
              PAPERLESS_TIME_ZONE: "${TIMEZONE:=America/New_York}"
              PAPERLESS_OCR_LANGUAGE: eng
              # shared dragonfly; index 0 is authentik, 1 is immich
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local.:6379/2
              PAPERLESS_DBENGINE: postgresql
              # Shared cluster in the database namespace — paperless has its own
              # database and its own role on it, not its own server. DBUSER and
              # DBPASS arrive from paperless-pg-secret via envFrom below.
              PAPERLESS_DBHOST: postgres-rw.database.svc.cluster.local.
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: paperless
              # inotify does not work over NFS — poll the consume directory
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Human-readable on-disk layout, independent of the app/database —
              # if Paperless is ever gone, the archive on the NFS share is still
              # self-describing. Folders stop at type/year/month; correspondent
              # and doc_pk (the document's own always-populated, globally-
              # incrementing database id, used as the sequence number since it
              # needs no manual setup, unlike ASN) live in the filename instead
              # of as further folder levels — a correspondent folder under
              # month would usually hold just one file anyway. Changing this
              # later retroactively renames every existing file to match.
              # app-template runs Helm's `tpl` over env values, so the Paperless
              # placeholders have to be wrapped in a Go raw string to survive
              # rendering — bare {{ ... }} makes the chart fail to template.
              PAPERLESS_FILENAME_FORMAT: >-
                {{ `{{ document_type }}/{{ created_year }}/{{ created_month }}/{{ doc_pk }}-{{ correspondent }}-{{ title }}` }}
              # Office documents and e-mail are parsed by the sidecar services
              PAPERLESS_TIKA_ENABLED: "1"
              PAPERLESS_TIKA_ENDPOINT: http://paperless-tika.productivity.svc.cluster.local:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg.productivity.svc.cluster.local:3000
              # Authentik SSO via django-allauth; the provider JSON (which carries
              # the client secret) is assembled in paperless-oidc-secret
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              # No PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS: it applies to every new
              # SSO signup uniformly, so it can't distinguish an adult login from a
              # kid's. New accounts land with zero Django permissions (a deliberate
              # fail-closed default — every new person is assigned to the correct
              # Paperless group by hand in Settings -> Users & Groups after their
              # first login).
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
            envFrom:
              - secretRef:
                  name: paperless-pg-secret
              - secretRef:
                  name: paperless-admin-secret
              - secretRef:
                  name: paperless-fields-secret
              - secretRef:
                  name: paperless-oidc-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /accounts/login/
                    port: 8000
                  # first boot runs migrations and builds the search index
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  periodSeconds: 30
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      # v3 images run rootless: the process starts directly as this uid/gid with
      # no internal remapping, so the NFS tree must be owned by 1000:1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: &runAsUser 1000
        runAsGroup: &runAsGroup 1000
        fsGroup: *runAsGroup
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: paperless
        ports:
          http:
            port: 8000
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          # scans can be large; stream them straight through to the app
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        hosts:
          - host: &host paperless.${SECRET_DOMAIN:=internal}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: wildcard-cert-tls
    persistence:
      # one NFS claim, split by subPath into the four volumes the image declares
      data:
        enabled: true
        existingClaim: paperless
        globalMounts:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
          - path: /usr/src/paperless/consume
            subPath: consume
          - path: /usr/src/paperless/export
            subPath: export
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
