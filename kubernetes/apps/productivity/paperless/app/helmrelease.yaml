---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: productivity
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      paperless:
        # single writer against the NFS document tree and the Tantivy index
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              # NOTE: ghcr image tags have no "v" prefix, unlike the GitHub release tag
              tag: 3.0.5
            env:
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN:=internal}
              PAPERLESS_TIME_ZONE: "${TIMEZONE:=America/New_York}"
              PAPERLESS_OCR_LANGUAGE: eng
              # shared dragonfly; index 0 is authentik/open-webui, 1 is immich
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local.:6379/2
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST:
                valueFrom:
                  secretKeyRef:
                    name: &dbSecret paperless-database-app
                    key: host
              PAPERLESS_DBPORT:
                valueFrom:
                  secretKeyRef:
                    name: *dbSecret
                    key: port
              PAPERLESS_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: *dbSecret
                    key: dbname
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: *dbSecret
                    key: username
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: *dbSecret
                    key: password
              # inotify does not work over NFS — poll the consume directory
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Office documents and e-mail are parsed by the sidecar services
              PAPERLESS_TIKA_ENABLED: "1"
              PAPERLESS_TIKA_ENDPOINT: http://paperless-tika.productivity.svc.cluster.local:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg.productivity.svc.cluster.local:3000
              # Authentik SSO via django-allauth; the provider JSON (which carries
              # the client secret) is assembled in paperless-oidc-secret
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
            envFrom:
              - secretRef:
                  name: paperless-admin-secret
              - secretRef:
                  name: paperless-fields-secret
              - secretRef:
                  name: paperless-oidc-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /accounts/login/
                    port: 8000
                  # first boot runs migrations and builds the search index
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  periodSeconds: 30
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      # v3 images run rootless: the process starts directly as this uid/gid with
      # no internal remapping, so the NFS tree must be owned by 1000:1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: &runAsUser 1000
        runAsGroup: &runAsGroup 1000
        fsGroup: *runAsGroup
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: paperless
        ports:
          http:
            port: 8000
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          # scans can be large; stream them straight through to the app
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        hosts:
          - host: &host paperless.${SECRET_DOMAIN:=internal}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: wildcard-cert-tls
    persistence:
      # one NFS claim, split by subPath into the four volumes the image declares
      data:
        enabled: true
        existingClaim: paperless
        globalMounts:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
          - path: /usr/src/paperless/consume
            subPath: consume
          - path: /usr/src/paperless/export
            subPath: export
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
