---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Vikunja's role on the SHARED database/postgres cluster. The role is ours to
# create, so the credential lives in Bitwarden ("vikunja pgcreds", a login item)
# and postgres-init reconciles the role against it on every start — which also
# means rotating the password in Bitwarden actually takes effect rather than
# locking the app out. Same shape as paperless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-pg
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: vikunja-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Read straight into the app's env (VIKUNJA_DATABASE_HOST/DATABASE are
        # plain values in the HelmRelease — only the credential is secret).
        VIKUNJA_DATABASE_USER: "{{ .pg_username }}"
        VIKUNJA_DATABASE_PASSWORD: "{{ .pg_password }}"
        # Consumed by the postgres-init initContainer
        INIT_POSTGRES_DBNAME: vikunja
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: pg_username
      remoteRef:
        key: vikunja pgcreds
        property: username
    - secretKey: pg_password
      remoteRef:
        key: vikunja pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # Vikunja itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      remoteRef:
        key: cloudnative_pg credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# JWT signing key. Rotating it invalidates every session and every CalDAV
# token, so treat it as write-once. Custom field on the Bitwarden item, hence
# the `bitwarden-fields` store rather than `bitwarden-login`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-fields
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: vikunja-fields-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_SERVICE_SECRET: "{{ .service_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: service_secret
      remoteRef:
        key: vikunja credentials
        property: service_secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client, delivered as a whole config.yml rather than as env
# vars. Vikunja will not accept a provider that exists only in the environment:
# the provider key has to be present in a config file first, and env vars can
# then only override fields on it. Assembling the file here keeps the client
# secret out of Git and avoids that split-brain entirely — everything else
# Vikunja needs still comes from env in the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-config
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: vikunja-config-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yml: |
          auth:
            # kept on as the break-glass path if Authentik is down, and as the
            # only way to hand out a plain CalDAV password; SSO is the normal
            # way in and self-signup is disabled in the HelmRelease.
            local:
              enabled: true
            openid:
              enabled: true
              providers:
                # `name` is also the callback path segment — it must match the
                # redirect URI registered in terraform/authentik, which is
                # https://tasks.${SECRET_DOMAIN:=internal}/auth/openid/authentik
                - name: authentik
                  authurl: https://auth.${SECRET_DOMAIN:=internal}/application/o/vikunja-provider/
                  clientid: "{{ .client_id }}"
                  clientsecret: "{{ .client_secret }}"
                  scope: openid profile email
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-vikunja
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-vikunja
        property: password
