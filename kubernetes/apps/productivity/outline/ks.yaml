---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-outline
  namespace: flux-system
spec:
  targetNamespace: productivity
  interval: 10m
  path: "./kubernetes/apps/productivity/outline/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: outline
      GATUS_SUBDOMAIN: wiki
      # The app-template claim for the `data` persistence key: uploaded images
      # and attachments (FILE_STORAGE=local). Every document lives in Postgres
      # (CNPG -> MinIO); this volume is only blobs.
      VOLSYNC_CLAIM: outline-data
      VOLSYNC_CAPACITY: 10Gi
      # the image runs as `nodejs` (uid/gid 1001) with no internal remapping
      VOLSYNC_PUID: "1001"
      VOLSYNC_PGID: "1001"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cluster-apps-external-secrets
    # the shared cluster, not the operator: Outline only needs postgres-rw
    # answering before init-db runs
    - name: cluster-apps-cloudnative-pg-cluster
    - name: dragonfly-cluster
    - name: cluster-apps-csi-driver-nfs
