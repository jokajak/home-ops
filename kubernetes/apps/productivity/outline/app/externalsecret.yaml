---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Outline's role on the SHARED database/postgres cluster, plus everything the
# app reads from the login store. postgres-init reconciles the role against
# "outline pgcreds" on every start, so rotating the password in Bitwarden takes
# effect rather than locking the app out. Same shape as mygarage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-pg
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: outline-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Outline takes a single connection URL. urlquery-escaped because the
        # generated password carries `+=,~`. No sslmode: Outline's default
        # (TLS, certificate not verified) is what CNPG's self-signed server
        # cert needs — see D1 in the plan doc.
        DATABASE_URL: >-
          postgres://{{ .pg_username | urlquery }}:{{ .pg_password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/outline
        # Consumed by the postgres-init initContainer
        INIT_POSTGRES_DBNAME: outline
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: pg_username
      remoteRef:
        key: outline pgcreds
        property: username
    - secretKey: pg_password
      remoteRef:
        key: outline pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # Outline itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      remoteRef:
        key: cloudnative_pg credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OIDC client pair minted by terraform/authentik's oidc_creds module.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-oidc
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: outline-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-outline
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-outline
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# SECRET_KEY signs sessions and encrypts integration secrets at rest; rotating
# it logs everyone out and orphans anything encrypted — write-once.
# UTILS_SECRET authenticates Outline's internal cron/utility endpoints.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-fields
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: outline-fields-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
        UTILS_SECRET: "{{ .utils_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: secret_key
      remoteRef:
        key: outline credentials
        property: secret_key
    - secretKey: utils_secret
      remoteRef:
        key: outline credentials
        property: utils_secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The admin API key the weekly export CronJob uses. Outline mints it, so it
# cannot exist before Outline is running: terraform creates the item with a
# `replace-me` sentinel (so this resolves and nothing blocks), and the owner
# pastes the real key over it once — see "outline export" in
# terraform/bitwarden/main.tf. Until then the export Job fails with a 401, which
# is the intended failure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-export
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: outline-export-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OUTLINE_API_KEY: "{{ .api_key }}"
  refreshInterval: 1h
  data:
    - secretKey: api_key
      remoteRef:
        key: outline export
        property: api_key
