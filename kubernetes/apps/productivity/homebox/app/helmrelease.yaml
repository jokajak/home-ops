---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
# Homebox — the house inventory. One item per appliance and Z-Wave device:
# model, serial, purchase date, warranty, manual, location, breaker, and a link
# to the Outline page that says what to do when it misbehaves. Its QR/asset-ID
# labels are what go on the physical things. See
# docs/plans/2026-11-08-bookstack-to-outline-and-homebox.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebox
  namespace: productivity
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      homebox:
        # single writer against the attachments claim
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Creates the homebox database and role on the shared cluster if they
          # are not there yet, then does nothing on every subsequent start.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom:
              - secretRef:
                  name: homebox-pg-secret
        containers:
          app:
            image:
              # rootless variant: runs as `nonroot` (65532) instead of root
              repository: ghcr.io/sysadminsmedia/homebox
              tag: 0.27.1-rootless
            env:
              TZ: "${TIMEZONE:=America/New_York}"
              # Postgres on the shared cluster instead of the SQLite default, so
              # the records ride CNPG -> MinIO rather than a SQLite file restic
              # copies while it is open. SSL_MODE defaults to `require`, which
              # lib/pq satisfies against CNPG's self-signed server cert (it
              # encrypts without verifying).
              HBOX_DATABASE_DRIVER: postgres
              HBOX_DATABASE_HOST: postgres-rw.database.svc.cluster.local.
              HBOX_DATABASE_PORT: "5432"
              HBOX_DATABASE_DATABASE: homebox
              # Attachments use the image's default local storage, which
              # resolves to /data — the claim below.
              #
              # OIDC. The issuer must match the discovery document's `issuer`
              # exactly, trailing slash included. Callback is
              # /api/v1/users/login/oidc/callback, registered in
              # application_homebox.tf.
              HBOX_OIDC_ENABLED: "true"
              HBOX_OIDC_ISSUER_URL: https://auth.${SECRET_DOMAIN:=internal}/application/o/homebox-provider/
              HBOX_OIDC_BUTTON_TEXT: Sign in with Authentik
              HBOX_OIDC_AUTO_REDIRECT: "true"
              # Absolute URLs (OIDC redirect, QR labels) are built from this.
              # Hostname only — no scheme.
              HBOX_OPTIONS_HOSTNAME: inventory.${SECRET_DOMAIN:=internal}
              # behind the ingress, so trust X-Forwarded-Proto to see https
              HBOX_OPTIONS_TRUST_PROXY: "true"
              # Authentik is the only way in. ALLOW_REGISTRATION gates only the
              # local sign-up form; OIDC sign-in provisions users regardless.
              HBOX_OPTIONS_ALLOW_LOCAL_LOGIN: "false"
              HBOX_OPTIONS_ALLOW_REGISTRATION: "false"
              HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
            envFrom:
              # HBOX_DATABASE_USERNAME / _PASSWORD, HBOX_OIDC_CLIENT_ID / _SECRET
              - secretRef:
                  name: homebox-pg-secret
              # HBOX_AUTH_API_KEY_PEPPER
              - secretRef:
                  name: homebox-fields-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /api/v1/status
                    port: 7745
                  # first boot runs the migrations
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  periodSeconds: 30
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # the rootless image runs as `nonroot` (65532), so the NFS data tree must
      # be owned by 65532:65532
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: &runAsGroup 65532
        fsGroup: *runAsGroup
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: homebox
        ports:
          http:
            port: 7745
    ingress:
      app:
        enabled: true
        className: internal
        hosts:
          - host: &host inventory.${SECRET_DOMAIN:=internal}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: wildcard-cert-tls
    persistence:
      # Item photos, manuals and receipts. Claim name is homebox-data, which is
      # what VOLSYNC_CLAIM in ks.yaml points the restic mover at.
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: nfs-csi
        retain: true
        globalMounts:
          - path: /data
