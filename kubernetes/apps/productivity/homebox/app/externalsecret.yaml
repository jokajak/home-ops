---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Homebox's role on the SHARED database/postgres cluster, plus its OIDC client
# pair. postgres-init reconciles the role against "homebox pgcreds" on every
# start, so rotating the password in Bitwarden takes effect. Same shape as
# vikunja (Homebox takes host/user/pass as separate variables, not a URL).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-pg
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: homebox-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HBOX_DATABASE_USERNAME: "{{ .pg_username }}"
        HBOX_DATABASE_PASSWORD: "{{ .pg_password }}"
        HBOX_OIDC_CLIENT_ID: "{{ .client_id }}"
        HBOX_OIDC_CLIENT_SECRET: "{{ .client_secret }}"
        # Consumed by the postgres-init initContainer
        INIT_POSTGRES_DBNAME: homebox
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: pg_username
      remoteRef:
        key: homebox pgcreds
        property: username
    - secretKey: pg_password
      remoteRef:
        key: homebox pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # Homebox itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      remoteRef:
        key: cloudnative_pg credentials
        property: password
    - secretKey: client_id
      remoteRef:
        key: authentik-client-homebox
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-homebox
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# HMAC pepper for stored API-key hashes. Homebox refuses to start without one
# (>= 32 bytes). Write-once: rotating it invalidates every issued API key,
# including whatever the AI agents hold.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-fields
  namespace: productivity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: homebox-fields-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HBOX_AUTH_API_KEY_PEPPER: "{{ .api_key_pepper }}"
  refreshInterval: 1h
  data:
    - secretKey: api_key_pepper
      remoteRef:
        key: homebox credentials
        property: api_key_pepper
