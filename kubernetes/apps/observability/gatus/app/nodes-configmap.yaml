---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-nodes-ep
  labels:
    gatus.io/enabled: "true"
data:
  # Node addresses come from the cluster-secrets-user Secret, wired in as an
  # optional substituteFrom by kubernetes/flux/apps.yaml. Adding a node means
  # adding it there and in talos/topf.yaml.
  #
  # NOTE: this file is not listed in ./kustomization.yaml, so Flux does not
  # apply it and these endpoints are not being monitored today. It has never
  # been wired in. Adding `- ./nodes-configmap.yaml` to the resources list is
  # all it would take; the substitutions above already resolve.
  config.yaml: |
    endpoints:
      - name: basement-dell-sff
        group: nodes
        url: tcp://${SECRET_NODE_BASEMENT_DELL_SFF}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: basement-lenovo-m910q
        group: nodes
        url: tcp://${SECRET_NODE_BASEMENT_LENOVO_M910Q}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: basement-rpi4-chocolate
        group: nodes
        url: tcp://${SECRET_NODE_BASEMENT_RPI4_CHOCOLATE}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: basement-rpi4-peach
        group: nodes
        url: tcp://${SECRET_NODE_BASEMENT_RPI4_PEACH}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: foyer-dell-3040
        group: nodes
        url: tcp://${SECRET_NODE_FOYER_DELL_3040}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: foyer-dell-mff
        group: nodes
        url: tcp://${SECRET_NODE_FOYER_DELL_MFF}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: foyer-hp-800g3
        group: nodes
        url: tcp://${SECRET_NODE_FOYER_HP_800G3}:10250
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
