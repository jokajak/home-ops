---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      homepage:
        # Stateless: config is all ConfigMaps, so a Recreate restart is harmless.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.7.0
            env:
              TZ: America/New_York
              # Required since v1: any request whose Host header is not listed
              # is rejected with 400, including the kubelet probes below.
              HOMEPAGE_ALLOWED_HOSTS: homepage.${SECRET_DOMAIN:=internal}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    # The probe would otherwise send Host: <pod-ip>:3000, which
                    # HOMEPAGE_ALLOWED_HOSTS rejects.
                    httpHeaders:
                      - name: Host
                        value: homepage.${SECRET_DOMAIN:=internal}
                  initialDelaySeconds: 5
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            # readOnlyRootFilesystem stays off: Homepage also writes under
            # /app/.next/cache and the docs don't enumerate every write path.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
        pod:
          # Discovery reads the API with the in-cluster ServiceAccount token.
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: homepage
        ports:
          http:
            port: 3000
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          # Don't list Homepage on itself.
          gethomepage.dev/enabled: "false"
        hosts:
          - host: &host homepage.${SECRET_DOMAIN:=internal}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts: [*host]
    serviceAccount:
      create: false
      name: homepage
    persistence:
      # Homepage writes logs/ (and copies skeleton config) under /app/config.
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config
      config-files:
        type: configMap
        name: homepage-configmap
        advancedMounts:
          homepage:
            app:
              - path: /app/config/settings.yaml
                subPath: settings.yaml
                readOnly: true
              - path: /app/config/kubernetes.yaml
                subPath: kubernetes.yaml
                readOnly: true
              - path: /app/config/services.yaml
                subPath: services.yaml
                readOnly: true
              - path: /app/config/widgets.yaml
                subPath: widgets.yaml
                readOnly: true
              - path: /app/config/bookmarks.yaml
                subPath: bookmarks.yaml
                readOnly: true
              - path: /app/config/docker.yaml
                subPath: docker.yaml
                readOnly: true
