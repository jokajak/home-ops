---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Everything Open WebUI needs that is not safe in a manifest:
#
#   WEBUI_SECRET_KEY  signs session cookies. Generated by terraform/bitwarden.
#                     Rotating it logs everyone out; it does not destroy data.
#   OPENAI_API_KEYS   bearer tokens for each Hermes agent's API server, joined
#                     with ";" in the same order as OPENAI_API_BASE_URLS in
#                     the HelmRelease — the SAME values each agent reads as
#                     its own API_SERVER_KEY. Open WebUI is the only thing
#                     that holds them besides the agents themselves.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: open-webui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .webui_secret_key }}"
        OPENAI_API_KEYS: "{{ .api_server_key_josh }};{{ .api_server_key_partner }}"
  refreshInterval: 1h
  data:
    # Same Bitwarden items the agents read, so the two can never drift apart.
    - secretKey: api_server_key_josh
      remoteRef:
        key: hermes josh gateway
        property: api_server_key
    - secretKey: api_server_key_partner
      remoteRef:
        key: hermes partner gateway
        property: api_server_key
    - secretKey: webui_secret_key
      remoteRef:
        key: open-webui credentials
        property: webui_secret_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client (terraform/authentik -> application_openwebui.tf).
# A confidential client, unlike the agents' dashboards: Open WebUI runs the
# code exchange server-side and sends a secret, so both halves are used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: open-webui-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OAUTH_CLIENT_ID: "{{ .client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-open-webui
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-open-webui
        property: password
