---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
#
# Open WebUI is the household assistant, at chat.<domain> — the whole of it, not
# a front end onto something else. The per-person Hermes agents it used to
# front were removed 2026-09-04; see the superseded note at the top of
# docs/plans/2026-08-24-hermes-household-agents.md for why.
#
# The backend is litellm, which is what it was built for (D2 in that plan): one
# ChatGPT subscription, one virtual key per consumer, and swapping in a local
# model later is an entry in litellm's model_list rather than a migration here.
#
# Memory now belongs to Open WebUI rather than to a per-person agent process:
# memories are scoped to the signed-in Authentik user, so identity is a column
# rather than a routing convention. The model picker names MODELS again, not
# people.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: ai
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # Same reasoning as litellm: this cluster has two RPi4s, and Open WebUI
      # pulls a sentence-transformers embedding model on first boot and runs it
      # on CPU. Scheduling that onto a Pi is not a good day for anyone.
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      open-webui:
        # SQLite on a single RWO volume: one writer, so no rolling update.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.3
            env:
              TZ: "${TIMEZONE:=America/New_York}"
              # ⚠️ LOAD-BEARING FOR GITOPS. Most of the settings below are
              # "PersistentConfig" variables: Open WebUI copies them into its
              # database on first boot and from then on ignores the environment
              # entirely. Left at the default, this file would describe the
              # first boot and nothing after it — the exact drift D5 already
              # flags for the agents' seeded config, except here there is no
              # reason to accept it. False keeps the environment authoritative.
              ENABLE_PERSISTENT_CONFIG: "false"
              # Required before OAuth will engage, and used to build callback
              # URLs.
              WEBUI_URL: "https://chat.${SECRET_DOMAIN:=internal}"
              # litellm is the backend, and the only one. Its /v1 is
              # OpenAI-compatible, so no adapter is needed; which upstream
              # actually answers is litellm's decision (see its configmap).
              # A single URL, so OPENAI_API_KEYS in open-webui-secret carries a
              # single virtual key rather than a ";"-joined list.
              OPENAI_API_BASE_URLS: "http://litellm.ai.svc.cluster.local:4000/v1"
              # Nothing here speaks Ollama; leaving it on costs a failing health
              # check every refresh.
              ENABLE_OLLAMA_API: "false"
              # Authentik is the only way in. No local password accounts exist
              # to fall back on — the Authentik application's policy bindings
              # (terraform/authentik/application_openwebui.tf) decide who can
              # sign in at all.
              ENABLE_SIGNUP: "false"
              ENABLE_LOGIN_FORM: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_PROVIDER_NAME: "Authentik"
              OAUTH_SCOPES: "openid email profile"
              OPENID_PROVIDER_URL: "https://auth.${SECRET_DOMAIN:=internal}/application/o/open-webui/.well-known/openid-configuration"
              OPENID_REDIRECT_URI: "https://chat.${SECRET_DOMAIN:=internal}/oauth/oidc/callback"
            envFrom:
              - secretRef:
                  name: open-webui-secret
              - secretRef:
                  name: open-webui-oidc-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  # First boot downloads the embedding model before it serves.
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                # The local embedding model is the reason this is not smaller.
                memory: 4Gi
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: mdi:message-text
          # Agent turns run long and responses stream. Without these the
          # connection is cut mid-answer.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
        hosts:
          # The one door. Two earlier designs owned this host and are gone:
          # hearthai's group-routing reverse proxy (an upstream OIDC bug), then
          # the two Hermes dashboards behind it. Nothing else serves chat now.
          - host: &host "chat.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        existingClaim: open-webui-data
        globalMounts:
          - path: /app/backend/data
