---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
#
# Open WebUI as a phone-friendly front end onto both household Hermes agents —
# the "one door" at chat.<domain> (docs/plans/2026-08-24-hermes-household-agents.md).
# Each agent's own dashboard at josh-hermes.<domain> / partner-hermes.<domain>
# remains available too; this is just a second, nicer surface onto the same
# agents.
#
# Both agents appear as separate models (OPENAI_API_BASE_URLS below); who can
# see which model is a manual grant in Open WebUI's own admin UI (Workspace >
# Models > Visibility), not something wired through Authentik group claims.
#
# The backend is the AGENT, not litellm. Hermes' API server is "a Hermes agent
# runtime, not a pure LLM proxy" — each request spawns a server-side AIAgent, so
# a chat here gets the same memory, skills and background learning the dashboard
# gets. Pointing this at litellm instead would produce a chat UI with no session
# and no memory, which is a different product.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: ai
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # Same reasoning as litellm: this cluster has two RPi4s, and Open WebUI
      # pulls a sentence-transformers embedding model on first boot and runs it
      # on CPU. Scheduling that onto a Pi is not a good day for anyone.
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      open-webui:
        # SQLite on a single RWO volume: one writer, so no rolling update.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.1
            env:
              TZ: "${TIMEZONE:=America/New_York}"
              # ⚠️ LOAD-BEARING FOR GITOPS. Most of the settings below are
              # "PersistentConfig" variables: Open WebUI copies them into its
              # database on first boot and from then on ignores the environment
              # entirely. Left at the default, this file would describe the
              # first boot and nothing after it — the exact drift D5 already
              # flags for the agents' seeded config, except here there is no
              # reason to accept it. False keeps the environment authoritative.
              ENABLE_PERSISTENT_CONFIG: "false"
              # Required before OAuth will engage, and used to build callback
              # URLs.
              WEBUI_URL: "https://chat.${SECRET_DOMAIN:=internal}"
              # The agents are the backend. /v1 on each Hermes API server is
              # OpenAI-compatible, so no adapter is needed. Order here MUST
              # match OPENAI_API_KEYS' order in open-webui-secret.
              OPENAI_API_BASE_URLS: "http://hermes-josh.ai.svc.cluster.local:8642/v1;http://hermes-partner.ai.svc.cluster.local:8642/v1"
              # Each agent runs under its own named profile, so /v1/models
              # advertises "josh" / "partner" rather than the default
              # "hermes-agent" alias — that is what keeps the two distinct in
              # the model picker.
              # Nothing here speaks Ollama; leaving it on costs a failing health
              # check every refresh.
              ENABLE_OLLAMA_API: "false"
              # Authentik is the only way in. No local password accounts exist
              # to fall back on — the Authentik application's policy binding
              # (to the household group) decides who can sign in at all; which
              # model(s) a signed-in user can then see is a separate, manual
              # grant in Open WebUI's own admin UI.
              ENABLE_SIGNUP: "false"
              ENABLE_LOGIN_FORM: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_PROVIDER_NAME: "Authentik"
              OAUTH_SCOPES: "openid email profile"
              OPENID_PROVIDER_URL: "https://auth.${SECRET_DOMAIN:=internal}/application/o/open-webui/.well-known/openid-configuration"
              OPENID_REDIRECT_URI: "https://chat.${SECRET_DOMAIN:=internal}/oauth/oidc/callback"
            envFrom:
              - secretRef:
                  name: open-webui-secret
              - secretRef:
                  name: open-webui-oidc-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  # First boot downloads the embedding model before it serves.
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                # The local embedding model is the reason this is not smaller.
                memory: 4Gi
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: mdi:message-text
          # Agent turns run long and responses stream. Without these the
          # connection is cut mid-answer.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
        hosts:
          # The one door (docs/plans/2026-08-24-hermes-household-agents.md).
          # hearthai used to own this host as a group-based reverse proxy;
          # that design hit an upstream OIDC bug and was superseded, and this
          # ingress replaces it. Each agent's own dashboard stays reachable
          # separately at josh-hermes.<domain> / partner-hermes.<domain>.
          - host: &host "chat.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        existingClaim: open-webui-data
        globalMounts:
          - path: /app/backend/data
