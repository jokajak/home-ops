---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# oauth2-proxy's OIDC client, and the key it signs session cookies with.
#
# Client id/secret come from terraform/authentik's oidc_creds module, exactly
# like every other application here. Unlike the agents' dashboards this is a
# CONFIDENTIAL client — oauth2-proxy runs server-side and holds a secret, so
# the terraform sets client_type accordingly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hearthai-oidc
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: hearthai-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_ID: "{{ .client_id }}"
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .client_secret }}"
        # Signs the session cookie. Rotating it logs everyone out and nothing
        # worse — unlike LiteLLM's salt key, this one is safe to change.
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookie_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-hearthai
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-hearthai
        property: password
    - secretKey: cookie_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: hearthai credentials
        property: cookie_secret
