---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The four Secrets the hearthai release consumes. All of them existed before the
# release was collapsed into one chart, with the same names and the same keys —
# the chart reads named keys out of Secrets that already exist in the namespace
# rather than templating credentials of its own, so nothing here had to change.
#
# Secret          Read by                Supplied to the chart as
# ------          -------                ------------------------
# open-webui-     Open WebUI             sessionSecret / llm.apiKeySecret
#   secret
# open-webui-     Open WebUI             auth.oidc.credentialsSecret
#   oidc-secret
# litellm-secret  LiteLLM + its          litellm.existingSecret
#                 postgres-init          (envFrom, both containers)
# meridian-secret meridian               meridian.existingSecret
#
# Everything Open WebUI needs that is not safe in a manifest:
#
#   WEBUI_SECRET_KEY  signs session cookies. Generated by terraform/bitwarden.
#                     Rotating it logs everyone out; it does not destroy data.
#   OPENAI_API_KEYS   Open WebUI's litellm virtual key — one value, matching
#                     the single entry in OPENAI_API_BASE_URLS. litellm mints
#                     it, so terraform seeds the Bitwarden field with a
#                     "replace-me" sentinel and the owner pastes the real one
#                     (terraform/bitwarden/README.md). Until then Open WebUI
#                     starts and cannot answer, rather than failing to start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: open-webui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .webui_secret_key }}"
        OPENAI_API_KEYS: "{{ .litellm_api_key }}"
  refreshInterval: 1h
  data:
    - secretKey: litellm_api_key
      remoteRef:
        key: open-webui litellm
        property: litellm_api_key
    - secretKey: webui_secret_key
      remoteRef:
        key: open-webui credentials
        property: webui_secret_key
---
# Authentik OIDC client (terraform/authentik -> application_openwebui.tf).
# A confidential client: Open WebUI runs the code exchange server-side and
# sends a secret, so both halves of the credential are used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: open-webui-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OAUTH_CLIENT_ID: "{{ .client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-open-webui
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-open-webui
        property: password
---
# LiteLLM proxy credentials.
#
# No upstream provider key: the household's model access is a ChatGPT
# subscription, which LiteLLM's `chatgpt/` provider authenticates over OAuth
# device code. That token is not a secret this repo can hand it — it is minted
# by a one-time interactive login and cached on the litellm-token PVC. The
# Claude side is the same shape and equally absent from here: meridian holds
# that login on its own PVC, and MERIDIAN_API_KEY below only gets LiteLLM
# through meridian's front door.
#
# ⚠️ LITELLM_SALT_KEY CANNOT BE ROTATED. It encrypts every provider credential
# stored in the LiteLLM database; changing it makes them permanently unreadable.
# Generate it once (`openssl rand -hex 32`), store it in Bitwarden, never touch it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        LITELLM_SALT_KEY: "{{ .salt_key }}"
        UI_USERNAME: "{{ .ui_username }}"
        UI_PASSWORD: "{{ .ui_password }}"

        # Authenticates LiteLLM *to meridian*, the Claude-subscription bridge —
        # not an Anthropic key. meridian's own auth check is opt-in, so this is
        # the only thing standing between a pod on the ai network and the Claude
        # subscription behind it. Referenced as os.environ/MERIDIAN_API_KEY by
        # the anthropic/ entries in litellm-config.
        MERIDIAN_API_KEY: "{{ .meridian_api_key }}"

        # Shared Postgres, own database and own role — the pattern authentik
        # already uses. urlquery-escaped because a generated password
        # containing @ : / # would otherwise silently corrupt the DSN.
        DATABASE_URL: "postgresql://{{ .pg_username | urlquery }}:{{ .pg_password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/litellm"

        # Consumed by the postgres-init initContainer, which creates the
        # database and role idempotently on every start.
        INIT_POSTGRES_DBNAME: litellm
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: master_key
      remoteRef:
        key: litellm credentials
        property: master_key
    - secretKey: salt_key
      remoteRef:
        key: litellm credentials
        property: salt_key
    - secretKey: ui_username
      remoteRef:
        key: litellm credentials
        property: ui_username
    - secretKey: ui_password
      remoteRef:
        key: litellm credentials
        property: ui_password
    # Terraform-generated (terraform/bitwarden), and read by meridian's own
    # ExternalSecret from the same item — the two sides of one shared gate.
    - secretKey: meridian_api_key
      remoteRef:
        key: meridian credentials
        property: api_key
    # Per-app role on the shared cluster (login item, like "authentik pgcreds").
    - secretKey: pg_username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: litellm pgcreds
        property: username
    - secretKey: pg_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: litellm pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # LiteLLM itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: cloudnative_pg credentials
        property: password
---
# Gates the proxy itself.
#
# meridian's API-key check is OPT-IN — auth.ts is a no-op when MERIDIAN_API_KEY
# is unset. Without it, anything that can reach port 3456 can spend the Claude
# subscription behind it, with no record of who did. That is fine on the
# loopback interface it was designed for and not fine on a cluster network.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meridian
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: meridian-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MERIDIAN_API_KEY: "{{ .api_key }}"
  refreshInterval: 1h
  data:
    - secretKey: api_key
      remoteRef:
        key: meridian credentials
        property: api_key
