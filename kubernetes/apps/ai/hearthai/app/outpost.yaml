---
# Give ingress-nginx a stable in-namespace name for the Authentik-managed
# proxy outpost that runs in the security namespace.
apiVersion: v1
kind: Service
metadata:
  name: hearthai-outpost
  namespace: ai
spec:
  type: ExternalName
  externalName: ak-outpost-hearthai.security.svc.cluster.local
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
# The outpost callback must be reachable on the protected application's host,
# but must not carry the auth annotations applied to the application ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hearthai-outpost
  namespace: ai
spec:
  ingressClassName: internal
  rules:
    - host: chat.${SECRET_DOMAIN:=internal}
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: hearthai-outpost
                port:
                  name: http
  tls:
    - hosts:
        - chat.${SECRET_DOMAIN:=internal}
