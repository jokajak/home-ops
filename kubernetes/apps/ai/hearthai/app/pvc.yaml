---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/persistentvolumeclaim-v1.json
# The release's storage, owned here rather than by the chart.
#
# The chart will create all four claims itself (with helm.sh/resource-policy:
# keep) if the matching existingClaim is left blank. These are passed in
# instead, for two reasons: they already hold the data, so the cutover from four
# separate releases to one is a rescheduling rather than a migration; and a
# claim Flux owns is a claim VolSync can be pointed at and `flux diff` can see.
#
# ⚠️ All four carry kustomize.toolkit.fluxcd.io/prune: disabled, so Flux will
# never delete them — not when an app is dropped from the namespace
# kustomization, not when a Kustomization is renamed, and not when a claim moves
# between Kustomizations, which is exactly what this refactor did. nfs-csi has
# reclaimPolicy: Delete behind it, so a PVC delete is a data delete. Removing
# one is a manual act, deliberately.
#
# Only hearthmem-data is backed up (VolSync, from ../ks.yaml). The other three
# are deliberately not:
#
#   open-webui-data  a trial. If it earns its place it moves to CNPG; until
#                    then, deleting the claim deletes the whole thing.
#   litellm-token    one OAuth token, re-obtainable by logging in again.
#   meridian-auth    same, for the Claude side.
#
# ── open-webui-data ───────────────────────────────────────────────────────────
# Open WebUI's own state: its SQLite database (users, chats, settings) and the
# RAG embedding model it downloads on first boot.
#
# SQLite rather than a role on the shared Postgres, deliberately. This is a
# trial — if it does not earn its place, deleting this claim deletes the whole
# thing, with nothing left behind in the household database. If it stays, move
# it to CNPG the way litellm did; see the consolidation plan.
#
# nfs-csi for the same reason every volume in this namespace is: no pod welded
# to a node. Open WebUI is a single-writer app, so the concurrency this costs
# does not matter here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ai
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-csi
---
# ── litellm-token ───────────────────────────────────────────────────────────────
# Holds the ChatGPT OAuth token (CHATGPT_TOKEN_DIR). Without it every pod
# restart would need a fresh device-code login, which is interactive — exactly
# the thing a GitOps deployment must not require on every reschedule.
#
# nfs-csi rather than openebs-hostpath, and the reasoning is the opposite of
# the agents' volumes. openebs-hostpath is node-local: it pins the pod to
# whichever node first bound the claim, and a lost node means a lost token.
# That trade is worth it for the agents, whose SQLite runs in WAL mode and
# cannot live on NFS at all. Here the volume holds one credential file — no
# WAL, no locking — so NFS is both safe and strictly better: the pod can move
# between nodes, which matters more now that litellm is also pinned to
# kubernetes.io/arch=amd64 and has fewer nodes to choose from.
#
# Still deliberately NOT enrolled in VolSync: the only thing here is a token
# regenerated by logging in again. Losing it costs two minutes, not data, and
# replicating a live credential to MinIO buys nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-token
  namespace: ai
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  storageClassName: nfs-csi
---
# ── meridian-auth ───────────────────────────────────────────────────────────────
# Holds the Claude Code credentials meridian authenticates with. Same shape and
# same reasoning as the LiteLLM token volume: credential files rather than a
# database, so nfs-csi is safe, keeps the pod free to reschedule, and survives
# losing a node.
#
# Checked rather than assumed: meridian bundles libsql, but its telemetry
# database lives at ~/.config/meridian/telemetry.db — the container's own
# filesystem, not this mount — so nothing puts SQLite on NFS here. (That DB is
# therefore ephemeral across restarts, which is fine for telemetry.)
#
# Not enrolled in VolSync, for the same reason as LiteLLM's: re-obtainable by
# logging in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meridian-auth
  namespace: ai
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  storageClassName: nfs-csi
---
# ── hearthmem-data ──────────────────────────────────────────────────────────────
# ReadWriteOnce is a correctness requirement, not a default: each store is a git
# repository guarded by one in-process writer lock, so exactly one pod may mount
# it.
#
# nfs-csi so the pod is not pinned to a node, matching the rest of the
# namespace. Git on NFS is tolerable precisely because of that single-writer
# lock — the failure mode people hit with git over NFS is concurrent access,
# which this service structurally prevents. Worth re-checking against real use
# if index.lock contention ever shows up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hearthmem-data
  namespace: ai
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-csi
