---
# Half of the access boundary. The other half is ingress-nginx overwriting the
# X-Auth-Request-* headers from the auth subrequest.
#
# The router decides which agent you reach by reading a header. That is only
# safe while the router is unreachable except through the ingress controller
# that sets it — anything else in the cluster that could open a connection to
# port 8080 could pick its own identity and read either person's private
# memory. This policy is what makes "only through the front door" true rather
# than assumed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hearthai-router-ingress-only
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hearthai
      app.kubernetes.io/component: router
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ingress-nginx
            k8s:io.kubernetes.pod.namespace: networking
    # kubelet probes come from the node, not from an endpoint.
    - fromEntities:
        - host
        - remote-node
