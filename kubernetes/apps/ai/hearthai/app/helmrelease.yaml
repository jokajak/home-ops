---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
#
# hearthai — one door for the household, reachable at https://chat.<domain>.
#
# The app is named for the project it implements; the hostname is what the
# household actually types. Keeping them different is deliberate — the
# Authentik slug, the Kubernetes resources and the service DNS all stay
# `hearthai`, so renaming the door again is an ingress change and nothing else.
#
# It authenticates once against Authentik and lands each
# person on their own agent. Nobody types a hostname that encodes which agent
# is theirs; the routing follows the login.
#
# Two controllers:
#   auth   — oauth2-proxy, the OIDC client. ingress-nginx calls its /oauth2/auth
#            on every request and copies the identity headers it returns onto
#            the upstream request.
#   router — nginx, reads X-Auth-Request-Groups and proxies to the right agent.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hearthai
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      auth:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.4
            env:
              OAUTH2_PROXY_PROVIDER: oidc
              OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Authentik
              OAUTH2_PROXY_OIDC_ISSUER_URL: "https://auth.${SECRET_DOMAIN:=internal}/application/o/hearthai/"
              OAUTH2_PROXY_REDIRECT_URL: "https://chat.${SECRET_DOMAIN:=internal}/oauth2/callback"
              OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
              # Emit X-Auth-Request-User / -Email / -Groups from /oauth2/auth.
              # The router keys off Groups; without this it gets nothing and
              # every request fails closed with a 403.
              OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
              # Authentik's default `profile` scope mapping carries the group
              # list, so no custom scope mapping is needed on the provider.
              OAUTH2_PROXY_SCOPE: "openid profile email"
              OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
              # Authentik is the gate; anyone it issues a token for is a
              # household member, and which agent they get is decided by group.
              OAUTH2_PROXY_EMAIL_DOMAINS: "*"
              # One IdP, so the interstitial "sign in with…" page is pure friction.
              OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
              OAUTH2_PROXY_REVERSE_PROXY: "true"
              OAUTH2_PROXY_COOKIE_SECURE: "true"
              OAUTH2_PROXY_COOKIE_DOMAINS: "chat.${SECRET_DOMAIN:=internal}"
              OAUTH2_PROXY_WHITELIST_DOMAINS: "chat.${SECRET_DOMAIN:=internal}"
              # Nothing is proxied through oauth2-proxy itself — ingress-nginx
              # only ever calls it as an auth subrequest, and the router does
              # the actual proxying.
              OAUTH2_PROXY_UPSTREAMS: "static://202"
            envFrom:
              - secretRef:
                  name: hearthai-oidc-secret
            probes:
              liveness: &authprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 4180
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *authprobe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }

      router:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/nginx
              tag: 1.29.3-alpine
            command:
              - /bin/sh
              - -c
              - |
                # Take the cluster DNS server from the pod's own resolv.conf.
                # nginx's `resolver` needs a literal address, and this repo does
                # not commit addresses — so read it at boot instead.
                set -eu
                RESOLVER="$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)"
                if [ -z "$RESOLVER" ]; then
                  echo "no nameserver in /etc/resolv.conf; cannot resolve agents" >&2
                  exit 1
                fi
                sed "s|__RESOLVER__|${RESOLVER}|" /config/nginx.conf.tmpl > /tmp/nginx.conf
                exec nginx -c /tmp/nginx.conf -g 'daemon off;'
            probes:
              liveness: &routerprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness: *routerprobe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile: { type: RuntimeDefault }

    service:
      auth:
        controller: auth
        ports:
          http:
            port: 4180
      router:
        controller: router
        primary: true
        ports:
          http:
            port: 8080

    ingress:
      # TWO Ingress objects on one host, deliberately. ingress-nginx applies
      # auth annotations per-Ingress, not per-path, so the sign-in flow has to
      # live on its own un-gated object — a gated /oauth2 is an infinite
      # redirect loop back to itself.
      auth:
        enabled: true
        className: internal
        hosts:
          - host: &host "chat.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /oauth2
                pathType: Prefix
                service:
                  identifier: auth
                  port: http
        tls:
          - hosts:
              - *host

      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: mdi:home-heart
          # Every request is authenticated here first. auth-response-headers is
          # what carries the identity through to the router — and, critically,
          # what makes ingress-nginx *overwrite* any same-named header the
          # client tried to set.
          nginx.ingress.kubernetes.io/auth-url: "http://hearthai-auth.ai.svc.cluster.local:4180/oauth2/auth"
          # No ?rd= here on purpose: ingress-nginx appends the redirect param
          # itself. Writing $escaped_request_uri by hand would not survive Flux
          # postBuild, which substitutes bare $VAR and would blank it.
          nginx.ingress.kubernetes.io/auth-signin: "https://chat.${SECRET_DOMAIN:=internal}/oauth2/start"
          nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups"
          # Agent turns run long and the dashboard holds an event stream open.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: router
                  port: http
        tls:
          - hosts:
              - *host
