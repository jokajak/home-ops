---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
#
# hearthai — one door for the household, reachable at https://chat.<domain>.
#
# The app is named for the project it implements; the hostname is what the
# household actually types. Keeping them different is deliberate — the
# Authentik slug, the Kubernetes resources and the service DNS all stay
# `hearthai`, so renaming the door again is an ingress change and nothing else.
#
# It authenticates once against Authentik and lands each
# person on their own agent. Nobody types a hostname that encodes which agent
# is theirs; the routing follows the login.
#
# ingress-nginx delegates authentication to Authentik's proxy outpost. The
# router reads X-Authentik-Groups and proxies to the right agent.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hearthai
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      router:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/nginx
              tag: 1.29.3-alpine
            command:
              - /bin/sh
              - -c
              - |
                # Take the cluster DNS server from the pod's own resolv.conf.
                # nginx's `resolver` needs a literal address, and this repo does
                # not commit addresses — so read it at boot instead.
                set -eu
                RESOLVER="$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)"
                if [ -z "$RESOLVER" ]; then
                  echo "no nameserver in /etc/resolv.conf; cannot resolve agents" >&2
                  exit 1
                fi
                # $$ below escapes it from Flux's postBuild.substitute, which
                # scans this whole script as text — it must reach the container
                # as a literal dollar-brace RESOLVER for the shell to expand.
                sed "s|__RESOLVER__|$${RESOLVER}|" /config/nginx.conf.tmpl > /tmp/nginx.conf
                exec nginx -c /tmp/nginx.conf -g 'daemon off;'
            probes:
              liveness: &routerprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness: *routerprobe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile: { type: RuntimeDefault }

    service:
      router:
        controller: router
        primary: true
        ports:
          http:
            port: 8080

    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: mdi:home-heart
          # Every request is authenticated here first. auth-response-headers is
          # what carries the identity through to the router — and, critically,
          # what makes ingress-nginx *overwrite* any same-named header the
          # client tried to set.
          nginx.ingress.kubernetes.io/auth-url: "http://hearthai-outpost.ai.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx"
          # ingress-nginx's annotation validator rejects auth-signin values that
          # hand-build a redirect target out of ${scheme}/${http_host}/${...}
          # braces concatenated into the query string — it silently drops the
          # whole annotation rather than failing admission, so no error_page
          # redirect ever gets rendered and unauthenticated requests just see a
          # bare 401. auth-signin-redirect-param lets ingress-nginx append the
          # rd= param itself with a value it already considers safe.
          nginx.ingress.kubernetes.io/auth-signin: "https://chat.${SECRET_DOMAIN:=internal}/outpost.goauthentik.io/start"
          nginx.ingress.kubernetes.io/auth-signin-redirect-param: "rd"
          nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-Authentik-Username,X-Authentik-Groups,X-Authentik-Email,X-Authentik-Name,X-Authentik-Uid"
          # Agent turns run long and the dashboard holds an event stream open.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: &host "chat.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: router
                  port: http
        tls:
          - hosts:
              - *host

    # The router reads its generated nginx configuration from the ConfigMap
    # and writes runtime files to the emptyDir while its root stays read-only.
    persistence:
      config:
        type: configMap
        name: hearthai-router
        advancedMounts:
          router:
            app:
              - path: /config
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          router:
            app:
              - path: /tmp
