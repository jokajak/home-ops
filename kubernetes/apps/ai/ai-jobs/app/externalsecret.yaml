---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The ai-jobs control plane's own Secret, in `ai`. The hearthai chart reads
# named keys out of it (A3/A6) the same way it reads litellm-secret.
#
# Bitwarden item "ai-jobs credentials" (custom fields; owner creates it, see
# the plan's "Sandbox namespace" owner steps):
#
#   caller_key_open_webui       bearer key Open WebUI presents to ai-jobs; any
#                               long random string. Also goes into Open WebUI's
#                               tool-server connection (A7).
#   memory_recall_read_token    hearthmem READ token for the household store
#                               (`hearthmem read-token <store>`). Never the
#                               store's write token. Minting a new one revokes
#                               the old; update the field and wait one refresh.
#
# Until the item exists the ExternalSecret reports an error and nothing else
# is affected: ai-jobs is not enabled yet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-jobs
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: ai-jobs-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        caller_key_open_webui: "{{ .caller_key_open_webui }}"
        memory_recall_read_token: "{{ .memory_recall_read_token }}"
        # The file ai-jobs reads as AI_JOBS_CALLER_KEYS_FILE:
        # {"<key>": "<caller id>"}; keys must be at least 32 characters.
        caller-keys.json: |
          {"{{ .caller_key_open_webui }}": "open-webui"}
  refreshInterval: 1h
  data:
    - secretKey: caller_key_open_webui
      remoteRef:
        key: ai-jobs credentials
        property: caller_key_open_webui
    - secretKey: memory_recall_read_token
      remoteRef:
        key: ai-jobs credentials
        property: memory_recall_read_token
