---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mindroom-matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: mindroom-matrix-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MATRIX_REGISTRATION_TOKEN: "{{ .registration_token }}"
  data:
    - secretKey: registration_token
      remoteRef:
        key: mindroom credentials
        property: registration_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mindroom
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: mindroom-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .litellm_api_key }}"
        MINDROOM_API_KEY: "{{ .api_key }}"
        MINDROOM_SANDBOX_PROXY_TOKEN: "{{ .sandbox_proxy_token }}"
  data:
    - secretKey: litellm_api_key
      remoteRef:
        key: mindroom litellm
        property: litellm_api_key
    - secretKey: api_key
      remoteRef:
        key: mindroom credentials
        property: api_key
    - secretKey: sandbox_proxy_token
      remoteRef:
        key: mindroom credentials
        property: sandbox_proxy_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mindroom-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: mindroom-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-mindroom
        property: username
    - secretKey: client_secret
      remoteRef:
        key: authentik-client-mindroom
        property: password
