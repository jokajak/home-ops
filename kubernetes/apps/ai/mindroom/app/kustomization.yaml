---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./tuwunel.yaml
  - ./runtime.yaml
  - ./client.yaml
  - ./ingress.yaml
configMapGenerator:
  - name: mindroom-config
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: mindroom
