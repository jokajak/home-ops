---
# Chart and images are pinned together; see ../README.md for upgrades.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mindroom-tuwunel
  namespace: ai
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: ./cluster/k8s/tuwunel
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: mindroom
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: mindroom-oidc-secret
      valuesKey: OIDC_CLIENT_ID
      targetPath: tuwunel.oidc.clientId
  values:
    fullnameOverride: mindroom-tuwunel
    image:
      repository: ghcr.io/mindroom-ai/mindroom-tuwunel
      tag: latest
      # yamllint disable-line rule:line-length
      digest: sha256:7c24472a5b4f5947808069ee67b1ccc5917bec26427359cae1ebcab6dd7508cc
      pullPolicy: IfNotPresent
    nodeSelector:
      kubernetes.io/arch: amd64
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'
    tuwunel:
      serverName: ${SECRET_DOMAIN}
      clientBaseUrl: https://matrix.${SECRET_DOMAIN}
      oidc:
        enabled: true
        brand: Authentik
        name: Household SSO
        issuer: https://auth.${SECRET_DOMAIN}/application/o/mindroom/
        clientSecret:
          existingSecret: mindroom-oidc-secret
        scope: [openid, profile, email]
        extraConfig: |
          userid_claims = ["preferred_username"]
          unique_id_fallbacks = false
          trusted = false
      registrationToken:
        existingSecret: mindroom-matrix-secret
      wellKnown:
        server: matrix.${SECRET_DOMAIN}:443
      extraConfig: |
        allow_federation = false
        allow_guest_registration = false
    storage:
      create: false
      existingClaim: mindroom-matrix-data
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
