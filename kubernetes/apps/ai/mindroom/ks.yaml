---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-mindroom
  namespace: flux-system
spec:
  targetNamespace: ai
  interval: 30m
  timeout: 10m
  path: ./kubernetes/apps/ai/mindroom/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cluster-apps-external-secrets
    - name: cluster-apps-external-secrets-bitwarden
    - name: cluster-apps-hearthai
