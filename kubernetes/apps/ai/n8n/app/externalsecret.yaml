---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# n8n's credentials.
#
# ⚠️ N8N_ENCRYPTION_KEY CANNOT BE ROTATED, for the same reason LITELLM_SALT_KEY
# cannot: it encrypts every credential n8n stores in its database (API tokens
# for whatever a workflow talks to). Change it and those rows become
# permanently unreadable — n8n refuses to decrypt them and the workflows using
# them break with no way back. Generate it once, store it, never touch it.
#
# Setting it here rather than letting n8n mint one on first boot is the whole
# point: left alone, n8n writes a random key into ~/.n8n/config on the PVC,
# which makes the volume — not this repo — the thing that must survive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: n8n-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"

        # Shared Postgres, own database and own role — the pattern litellm and
        # authentik already use. n8n takes the DSN in pieces rather than as a
        # URL, so there is nothing to url-escape here.
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: postgres-rw.database.svc.cluster.local
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: n8n
        DB_POSTGRESDB_USER: "{{ .pg_username }}"
        DB_POSTGRESDB_PASSWORD: "{{ .pg_password }}"

        # Consumed by the postgres-init initContainer, which creates the
        # database and role idempotently on every start.
        INIT_POSTGRES_DBNAME: n8n
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .pg_username }}"
        INIT_POSTGRES_PASS: "{{ .pg_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .pg_super_pass }}"
  refreshInterval: 1h
  data:
    - secretKey: encryption_key
      remoteRef:
        key: n8n credentials
        property: encryption_key
    # Per-app role on the shared cluster (login item, like "litellm pgcreds").
    - secretKey: pg_username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: n8n pgcreds
        property: username
    - secretKey: pg_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: n8n pgcreds
        property: password
    # Superuser, only so postgres-init can CREATE DATABASE / CREATE ROLE.
    # n8n itself connects as its own unprivileged role.
    - secretKey: pg_super_pass
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: cloudnative_pg credentials
        property: password
