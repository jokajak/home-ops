---
# The other half of API_SERVER_HOST=0.0.0.0.
#
# The API server's bearer token is the only thing standing between a caller and
# a full agent session with Josh's private memory — and it is a static string
# in an env var, not a per-request identity. Binding to 0.0.0.0 makes that port
# reachable by every pod in the cluster, so this policy is what puts it back to
# "Open WebUI and nothing else".
#
# ⚠️ SELECTING THIS POD DEFAULT-DENIES EVERYTHING NOT LISTED HERE. Cilium leaves
# an endpoint alone until some policy selects it; from then on the allow-list is
# exhaustive. That is why the dashboard's own rule appears below even though it
# has nothing to do with the API server — without it, adding this file would
# quietly take josh-hermes.<domain> off the air.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-josh-api-server
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-josh
  ingress:
    # The agent API, for Open WebUI only.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: open-webui
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
    # The dashboard, reached through the ingress controller as before.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ingress-nginx
            k8s:io.kubernetes.pod.namespace: networking
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
    # kubelet probes arrive from the node, not from an endpoint.
    - fromEntities:
        - host
        - remote-node
