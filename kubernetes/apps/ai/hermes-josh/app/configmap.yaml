---
# Bootstrap configuration for Josh's agent, seeded onto the data volume
# only if no config.yaml is there yet (see the seed-config init container).
#
# It is deliberately not enforced on every reconcile. Hermes rewrites this file
# when the agent or its user changes a model, toggles a tool, or learns a
# setting — that self-modification is the product, and a read-only mount would
# break it. Bootstrap is code; what the agent becomes lives on the PVC and in
# its VolSync snapshots. The gap is real and is recorded in
# docs/plans/2026-08-24-hermes-household-agents.md (D5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-josh-config
  namespace: ai
data:
  config.yaml: |
    model:
      # Resolves against the providers: entry below by key. If Hermes ever
      # fails to resolve it, the canonical long form is "custom:litellm".
      provider: "litellm"
      default: "claude-opus-5"

    # The household router. No API key and no upstream provider is named here:
    # LITELLM_API_KEY is this agent's virtual key, injected from Bitwarden, and
    # which model actually answers is LiteLLM's decision to make.
    providers:
      litellm:
        name: litellm
        base_url: "http://litellm.ai.svc.cluster.local:4000/v1"
        key_env: "LITELLM_API_KEY"
        default_model: "claude-opus-5"

    database:
      # Valid because this volume is openebs-hostpath (local disk). Were it ever
      # moved to NFS this would have to become "delete" — see pvc.yaml.
      journal_mode: "wal"

    skills:
      # hearthai's shared-memory skill, cloned at boot and mounted read-only.
      # A missing path is skipped silently, so a failed clone costs the skill
      # for that session and nothing else.
      external_dirs:
        - /opt/hearthai/skills

    # Upstream recommends circuit-breaking for unattended gateway deployments:
    # nobody is watching this terminal, and a stuck tool loop bills real money.
    tool_loop_guardrails:
      hard_stop_enabled: true
      hard_stop_after:
        exact_failure: 5
        idempotent_no_progress: 5
