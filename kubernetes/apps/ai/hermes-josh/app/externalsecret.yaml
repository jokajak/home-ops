---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Josh's LiteLLM virtual key. Minted in the LiteLLM admin UI (it cannot be
# created declaratively — it lives in LiteLLM's database), then stored in
# Bitwarden as "hermes josh" -> litellm_api_key.
#
# EVENTUALLY CONSISTENT BY DESIGN. terraform/bitwarden creates this item with
# an EMPTY litellm_api_key, because ESO has no per-key "optional" — one
# unresolvable data[] entry means the whole Secret is never created and this
# agent never starts. An empty value lets everything reconcile; the agent runs
# and returns auth errors until a real key is pasted in, which is a far better
# failure than a pod that cannot exist. Terraform ignores the value forever
# after, so pasting it is permanent.
#
# This agent never holds an upstream provider credential. Revoking this key in
# LiteLLM cuts off this agent alone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-josh
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: hermes-josh-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # `default ""` so an unset key yields an empty string rather than
        # anything that looks like a credential. Belt and braces: the item is
        # terraform-created with the field present, so this normally resolves
        # to the empty value already.
        LITELLM_API_KEY: "{{ .litellm_api_key | default \"\" }}"
        # Opens the agent's API server (the listener stays shut without it)
        # and authenticates Open WebUI to it. Generated by terraform/bitwarden;
        # Open WebUI reads the same Bitwarden field as OPENAI_API_KEY, so the
        # two cannot drift apart.
        API_SERVER_KEY: "{{ .api_server_key }}"
  refreshInterval: 1h
  data:
    - secretKey: litellm_api_key
      remoteRef:
        key: hermes josh
        property: litellm_api_key
    - secretKey: api_server_key
      remoteRef:
        key: hermes josh gateway
        property: api_server_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client for this agent's dashboard (terraform/authentik ->
# application_hermes.tf). A public PKCE client, so only the id is used; the
# module generates a secret alongside it that this deployment ignores.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-josh-oidc
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: hermes-josh-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .client_id }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-hermes-josh
        property: username
