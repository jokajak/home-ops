---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/persistentvolumeclaim-v1.json
# Holds the Claude Code credentials meridian authenticates with. Same shape as
# the LiteLLM token volume: small, and its contents are re-obtainable by
# logging in again, so it is deliberately not enrolled in VolSync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meridian-auth
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  storageClassName: openebs-hostpath
