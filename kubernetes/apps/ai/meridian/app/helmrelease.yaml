---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
#
# meridian — the Claude-side twin of what LiteLLM's `chatgpt/` provider does
# for OpenAI. It bridges the Claude Agent SDK to a standard Anthropic API
# endpoint, so a Claude subscription can back tools that expect an API.
#
# ⚠️ THIS IS INERT UNTIL SOMEONE LOGS IT IN. It authenticates by holding Claude
# Code credentials in /home/claude/.claude — there is no API key to inject and
# nothing this repo can hand it. The login is interactive and happens once or
# twice in this component's life, so it is written down rather than automated:
# see "meridian: logging it in" in
# docs/plans/2026-08-24-hermes-household-agents.md. Short version — get a
# ~/.claude/.credentials.json from a host where `claude` is logged in and
# `kubectl cp` it onto the meridian-auth volume, then restart the pod.
#
# ClusterIP only, no ingress. It is an API endpoint for other cluster
# workloads, not a surface for a person. The consumer is LiteLLM: the
# anthropic/ entries in litellm-config point their api_base at this service,
# so anything behind the router can reach Claude models with the same virtual
# keys it already uses for the ChatGPT ones, without holding a credential.
# Those entries 401 and fail their 300s health check until the login above is
# done — noisy, not harmful.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meridian
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      meridian:
        # Single writer against the credentials volume, and the SDK keeps
        # session state in-process.
        strategy: Recreate
        containers:
          app:
            image:
              # NOTE: the GHCR tags and the repo's git tags use different
              # series — git is on v1.29.x while the registry is on 1.62.x.
              # Renovate follows the registry, which is what actually ships.
              repository: ghcr.io/rynfar/meridian
              tag: 1.68.0
            env:
              TZ: "${TIMEZONE:=America/New_York}"
              # Reachable from other pods rather than container-loopback only.
              HOST: 0.0.0.0
              PORT: "3456"
              # Removes the one piece of unsolicited egress a source review
              # turned up: a daily version check against registry.npmjs.org.
              # Benign, but a household assistant should not phone anywhere
              # it was not asked to.
              NO_UPDATE_CHECK: "1"
            envFrom:
              # MERIDIAN_API_KEY. Its auth check is opt-in — no key, no gate —
              # so this is what stops any pod that can reach :3456 from
              # spending the subscription anonymously.
              - secretRef:
                  name: meridian-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3456
                  initialDelaySeconds: 15
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            # The image ships USER claude (uid 1000) and expects to own its
            # credentials directory; fsGroup makes the PVC writable to it
            # without an init container doing a chown.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: meridian
        ports:
          http:
            port: 3456
    persistence:
      auth:
        existingClaim: meridian-auth
        globalMounts:
          - path: /home/claude/.claude
