---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Gates the proxy itself.
#
# meridian's API-key check is OPT-IN — auth.ts is a no-op when MERIDIAN_API_KEY
# is unset. Without it, anything that can reach port 3456 can spend the Claude
# subscription behind it, with no record of who did. That is fine on the
# loopback interface it was designed for and not fine on a cluster network.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meridian
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: meridian-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MERIDIAN_API_KEY: "{{ .api_key }}"
  refreshInterval: 1h
  data:
    - secretKey: api_key
      remoteRef:
        key: meridian credentials
        property: api_key
