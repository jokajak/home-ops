---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  # The household's inference router: one upstream credential, one virtual key
  # per agent. Both agents depend on it.
  - ./litellm/ks.yaml
  # One agent per person — separate process, separate volume, separate memory.
  - ./hermes-josh/ks.yaml
  - ./hermes-partner/ks.yaml
  # ./hearthmem/ks.yaml is intentionally absent: its image is not published yet.
  # See ./hearthmem/README.md.
