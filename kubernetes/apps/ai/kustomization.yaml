---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  # The household's inference router: one subscription, one virtual key per
  # agent. Both agents depend on it.
  - ./litellm/ks.yaml
  # One agent per person — separate process, separate volume, separate memory.
  # Neither has a hostname of its own; both sit behind hearthai.
  - ./hermes-josh/ks.yaml
  - ./hermes-partner/ks.yaml
  # The household door: one URL, routed to your agent by who you logged in as.
  - ./hearthai/ks.yaml
  # Claude-subscription bridge. Inert until logged in; see its HelmRelease.
  - ./meridian/ks.yaml
  # A chat front end onto Josh's agent, at josh-chat. A TRIAL, wired to one
  # agent only — see its HelmRelease for why it is not in front of both.
  - ./open-webui/ks.yaml
  # The shared-memory store both agents read and write. Was staged pending an
  # image; jokajak/hearthai v0.1.0 published ghcr.io/jokajak/hearthmem.
  - ./hearthmem/ks.yaml
