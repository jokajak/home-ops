---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  # The household's inference router: one subscription, one virtual key per
  # consumer. Open WebUI depends on it.
  - ./litellm/ks.yaml
  # Claude-subscription bridge. Inert until logged in; see its HelmRelease.
  - ./meridian/ks.yaml
  # The household assistant, at chat.<domain>. Talks to litellm directly; the
  # per-person Hermes agents it used to front were removed 2026-09-04, see
  # docs/plans/2026-08-24-hermes-household-agents.md.
  - ./open-webui/ks.yaml
  # The hearthai shared-memory store. Its consumers were the Hermes agents'
  # shared-memory skill, so it currently has none — kept while its future as a
  # store of record is decided; see kubernetes/apps/ai/hearthmem/README.md.
  - ./hearthmem/ks.yaml
