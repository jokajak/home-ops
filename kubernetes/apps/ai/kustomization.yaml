---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  # The household AI stack as one release: Open WebUI at chat.<domain>, the
  # litellm inference router behind it, meridian's Claude bridge, and the
  # hearthmem shared-memory store. Packaged by jokajak/hearthai; this repo
  # supplies the site values, the Secrets, the claims and the database.
  - ./hearthai/ks.yaml
  # Workflow automation, at n8n.<domain>. A trial (2026-09-06); here rather
  # than in productivity because litellm is the point of it.
  - ./n8n/ks.yaml
  # Self-hosted metasearch, cluster-internal only. Exists to be hearthai's
  # search provider instead of a commercial SERP key — no account, no per-query
  # cost, and the household's queries stay off a vendor's logs.
  - ./searxng/ks.yaml
