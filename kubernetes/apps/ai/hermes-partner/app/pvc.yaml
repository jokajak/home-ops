---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/persistentvolumeclaim-v1.json
# nfs-csi, so this agent is never welded to one node.
#
# This started on openebs-hostpath because Hermes keeps its sessions, memory and
# search index in SQLite, and SQLite's default WAL mode needs shared-memory
# mapping that NFS does not provide. Node-local disk was the price of WAL.
#
# The price turned out to be the wrong way round: node-local storage pins the
# pod to whichever node first bound the claim, and losing that node means
# restoring from backup to get the agent back. Upstream supports the other side
# of the trade directly — `database.journal_mode: "delete"`, set in this app's
# seeded config.yaml, which uses POSIX locks instead of shared memory and is
# what their docs prescribe "for deployments whose backing filesystem is not
# WAL crash-safe, such as ... NFS".
#
# ⚠️ THE TWO SETTINGS ARE A PAIR. This class with WAL still enabled risks
# database corruption, not merely slowness. If this ever moves back to a local
# class, flip journal_mode back with it.
#
# Note also that Hermes "will not live-downgrade a database already open in
# WAL" — so the journal mode has to be right before the first boot that creates
# state.db. Changing storage class recreates the volume empty, which is exactly
# when that is true.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-partner-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-csi
