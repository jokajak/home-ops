---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
#
# Partner's Hermes agent.
#
# One container per person, not one container with two profiles. Upstream
# recommends the multi-profile layout and it is cheaper, but it lists
# "distinct credentials never share an OS-level process tree" as a reason to
# override that default — which is exactly hearthai's first non-negotiable:
# a private memory store is private by construction, not by policy.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-partner
  namespace: ai
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      hermes-partner:
        # One writer only: SQLite in WAL mode plus s6 supervision state on an
        # RWO volume. Upstream is explicit that two gateways against one data
        # directory corrupt sessions and memory, so no rolling update.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            # Must start as root. The image's PID 1 is s6-overlay, which remaps
            # its internal hermes user to HERMES_UID/HERMES_GID, chowns the data
            # volume, then drops every supervised service to that user with
            # s6-setuidgid. The image's own entrypoint rejects being started as
            # an arbitrary non-root UID, so runAsNonRoot is not available here.
            runAsUser: 0
        initContainers:
          # Register the "partner" profile with the real `hermes profile
          # create` CLI on first boot only (idempotent — skips if already
          # registered). HERMES_HOME here is the profile ROOT (/opt/data),
          # not the profile itself: container_boot.py's boot-time reconciler
          # (wired in as /etc/cont-init.d/02-reconcile-profiles) walks
          # $HERMES_HOME/profiles/* to register each one as an s6 gateway
          # service slot, and only understands HERMES_HOME as the root. A
          # prior version of this container hand-rolled the profile
          # directory with mkdir/cp instead of calling `profile create`,
          # which skipped that registration entirely (and left config.yaml
          # without a _config_version, which hermes-agent refuses to
          # auto-migrate) — the app container booted believing profile
          # "partner" simply didn't exist.
          01-create-profile:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.27
            env:
              HERMES_HOME: "/opt/data"
            command:
              - /bin/sh
              - -c
              - |
                if [ -d /opt/data/profiles/partner ]; then
                  echo "profile 'partner' already registered — leaving it alone"
                  exit 0
                fi
                # `profile create` drops privilege to the hermes UID before
                # writing anything (so nothing it creates ends up root-owned),
                # which means it needs /opt/data itself already writable by
                # that UID — otherwise it PermissionErrors before creating a
                # single file, even running as root.
                chown 10000:10000 /opt/data
                hermes profile create partner --no-skills
                # `profile create` scaffolds a generic default config.yaml —
                # our household settings (LiteLLM router, HEARTHMEM, tool-loop
                # guardrails) replace it once, here, on the profile's first
                # boot only. Afterwards the agent owns the file.
                cp /seed/config.yaml /opt/data/profiles/partner/config.yaml
                # The image's boot-time chown is targeted: it fixes the data
                # directory itself and a fixed list of subdirectories, not
                # arbitrary files at the top level. Root-owned files created
                # by this init container (which runs as root) would survive
                # that and the agent could never rewrite them.
                chown -R 10000:10000 /opt/data/profiles
                chmod 0644 /opt/data/profiles/partner/config.yaml
                echo "profile 'partner' created and seeded"
          # hearthai's shared-memory skill, fetched fresh each start so it
          # tracks upstream rather than being vendored (and drifting) here.
          02-fetch-skills:
            image:
              repository: docker.io/alpine/git
              tag: v2.54.0
            command:
              - /bin/sh
              - -c
              - |
                # Best effort by design: GitHub being unreachable must not keep
                # a household assistant from starting. Hermes skips a missing
                # external skills directory silently, so the cost of failure is
                # shared memory being unavailable for this session — and the
                # skill's CLI fails loudly if called, rather than quietly
                # pretending something was shared.
                git clone --depth 1 https://github.com/jokajak/hearthai /opt/hearthai ||
                  echo "warn: hearthai clone failed — shared-memory skill unavailable"
                exit 0
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.27
            # The CMD is a pure heartbeat, NOT the gateway invocation — the
            # real gateway is already running by the time this container's
            # services start. container_boot.py's boot-time reconciler
            # (/etc/cont-init.d/02-reconcile-profiles, see the
            # 01-create-profile init container) auto-starts a dynamically
            # registered, independently s6-supervised "gateway-partner" slot
            # on every boot, since the profile's persisted desired_state is
            # "running". Running `hermes -p partner gateway run` here too, on
            # top of that, hits an upstream bug in hermes-agent's "attach to
            # the already-running supervised instance" path: it crashes with
            # `s6-applyuidgid: fatal: unable to exec -p` regardless of
            # --no-supervise/--external-supervisor, because a second
            # dispatcher for the same profile isn't a supported combination.
            # `sleep infinity` just keeps this s6 "legacy-services" slot (and
            # therefore the container) alive; killing it tears down the
            # sibling "dashboard" and "main-hermes" services too (Architecture
            # B: the container exits when the CMD does), so a crash here still
            # gets Kubernetes to restart the whole pod as intended.
            args: ["sleep", "infinity"]
            env:
              # HERMES_HOME must be the profile ROOT, never
              # <root>/profiles/<name> directly — container_boot.py's
              # boot-time reconciler (/etc/cont-init.d/02-reconcile-profiles)
              # walks $HERMES_HOME/profiles/* to register each one as an s6
              # gateway service slot, and only understands HERMES_HOME as the
              # root. Pointing it straight at profiles/partner (an earlier
              # version of this file) made the reconciler treat that
              # directory itself as the root, see no profiles/ subdirectory
              # inside it, and register nothing named "partner" — the gateway
              # then failed at startup with "no such gateway 'partner'" even
              # though the profile's data was right there on disk. This same
              # cont-init.d script also runs inside THIS container (it's part
              # of the image's own boot sequence, independent of args above),
              # which is why it matters here even though the CMD is a no-op.
              HERMES_HOME: "/opt/data"
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              TZ: "${TIMEZONE:=America/New_York}"
              HERMES_TIMEZONE: "${TIMEZONE:=America/New_York}"
              # The web dashboard is this household's only surface — no
              # Telegram/Discord/Signal is available to it.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: "0.0.0.0"
              HERMES_DASHBOARD_PORT: "9119"
              # Temporary bypass of the shared hearthai door: hermes-agent's own
              # dashboard OIDC gate cannot be disabled on a non-loopback bind
              # (docs/plans/2026-08-24-hermes-household-agents.md), so a login
              # through chat.<domain> authenticates twice — once at the outpost,
              # once at the dashboard — and hermes-agent's callback handler has
              # a bug where it POSTs the same authorization code to /token
              # twice, so the second exchange fails with "Code does not exist".
              # Pointing Partner directly at their own host removes the outpost
              # layer for this path, leaving hermes-agent's own OIDC as the only
              # gate (still access-controlled: Authentik only issues tokens for
              # this application to the "Hermes Partner" group). chat.<domain>
              # is left in place — hearthai still exists for the shared memory
              # store (HEARTHMEM), just not as the login path for either agent.
              #
              # The host is partner-hermes, NOT partner-chat — see the matching
              # comment in hermes-josh's HelmRelease for why the name matters.
              # Declaring the public URL also force-engages the auth gate. The dashboard
              # fails closed at startup if no auth provider is configured —
              # that hardening followed a 2026 campaign in which exposed
              # dashboards were driven into planting SSH backdoors.
              HERMES_DASHBOARD_PUBLIC_URL: "https://partner-hermes.${SECRET_DOMAIN:=internal}"
              # Authentik. Note the trailing slash — Authentik's issuer
              # includes it, and the plugin pins the iss claim to this value.
              HERMES_DASHBOARD_OIDC_ISSUER: "https://auth.${SECRET_DOMAIN:=internal}/application/o/hermes-partner/"
              # hearthai shared memory. See kubernetes/apps/ai/hearthmem.
              HEARTHMEM_URL: "http://hearthmem.ai.svc.cluster.local"
              HEARTHMEM_AUTHOR: "partner"
              # Keep the store address book on the data volume so it is backed
              # up with everything else, rather than in the tool-subprocess HOME.
              HEARTHMEM_HOME: "/opt/data/profiles/partner/hearthmem"
              # Hermes' OpenAI-compatible API server, which is what Open WebUI
              # talks to (see kubernetes/apps/ai/open-webui) — same as
              # hermes-josh.
              #
              # 0.0.0.0 because the caller is in another pod. That makes the
              # port reachable by anything in the cluster, so networkpolicy.yaml
              # is not optional here — it is the other half of this setting.
              # The listener also refuses to open unless API_SERVER_KEY is at
              # least 16 characters; it arrives via envFrom from Bitwarden.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              API_SERVER_PORT: "8642"
            envFrom:
              - secretRef:
                  name: hermes-partner-secret
              - secretRef:
                  name: hermes-partner-oidc-secret
            probes:
              # TCP rather than HTTP: every dashboard route is behind the auth
              # gate, so a probe's status code depends on redirect behaviour.
              # "Is it listening" is the question a probe should be asking.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: &probe
                    port: 9119
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: *probe
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket: *probe
                  # First boot builds the profile tree on an empty volume.
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi
    service:
      app:
        controller: hermes-partner
        ports:
          http:
            port: 9119
          api:
            port: 8642
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: mdi:home-heart
          # Agent turns run long and the dashboard holds an event stream open.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: &host "partner-hermes.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        existingClaim: hermes-partner-data
        advancedMounts:
          hermes-partner:
            01-create-profile:
              - path: /opt/data
            app:
              - path: /opt/data
      bootstrap:
        type: configMap
        name: hermes-partner-config
        advancedMounts:
          hermes-partner:
            01-create-profile:
              - path: /seed/config.yaml
                subPath: config.yaml
                readOnly: true
      hearthai:
        type: emptyDir
        advancedMounts:
          hermes-partner:
            02-fetch-skills:
              - path: /opt/hearthai
            app:
              # Read-only is what makes external_dirs an actual boundary:
              # upstream warns they are not write-protected by themselves, and
              # the agent's autonomous skill curator would otherwise be free to
              # rewrite the shared-memory contract.
              - path: /opt/hearthai
                readOnly: true
