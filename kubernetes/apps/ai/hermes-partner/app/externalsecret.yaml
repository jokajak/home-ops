---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Partner's LiteLLM virtual key. Minted in the LiteLLM admin UI (it cannot be
# created declaratively — it lives in LiteLLM's database), then stored in
# Bitwarden as "hermes partner" -> litellm_api_key.
#
# This agent never holds an upstream provider credential. Revoking this key in
# LiteLLM cuts off this agent alone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-partner
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: hermes-partner-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_API_KEY: "{{ .litellm_api_key }}"
  refreshInterval: 1h
  data:
    - secretKey: litellm_api_key
      remoteRef:
        key: hermes partner
        property: litellm_api_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client for this agent's dashboard (terraform/authentik ->
# application_hermes.tf). A public PKCE client, so only the id is used; the
# module generates a secret alongside it that this deployment ignores.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-partner-oidc
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: hermes-partner-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .client_id }}"
  refreshInterval: 1h
  data:
    - secretKey: client_id
      remoteRef:
        key: authentik-client-hermes-partner
        property: username
