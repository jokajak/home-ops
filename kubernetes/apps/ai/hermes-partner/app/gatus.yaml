---
# This agent has no hostname of its own any more — it is reachable only through
# hearthai, which is where the HTTP check lives. What is still worth watching
# is whether the dashboard is actually listening, so gatus checks the service
# directly from inside the cluster.
#
# TCP rather than HTTP on purpose: with the public URL pinned to hearthai, the
# dashboard's DNS-rebinding guard rejects a request arriving with a different
# Host header, so an in-cluster HTTP probe would fail for the wrong reason.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-partner-gatus-ep
  namespace: ai
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "hermes-partner"
        group: internal
        url: "tcp://hermes-partner.ai.svc.cluster.local:9119"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
