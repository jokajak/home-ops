---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-hermes-partner
  namespace: flux-system
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: hermes-partner
  components:
    - ../../../../components/volsync
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/ai/hermes-partner/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  postBuild:
    substitute:
      APP: hermes-partner
      VOLSYNC_CLAIM: hermes-partner-data
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_STORAGECLASS: nfs-csi
      # s6 drops every supervised service to uid/gid 10000 inside the
      # container, so that is who owns the files the restic mover reads.
      VOLSYNC_PUID: "10000"
      VOLSYNC_PGID: "10000"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cluster-apps-external-secrets
    - name: cluster-apps-external-secrets-bitwarden
    - name: cluster-apps-litellm
