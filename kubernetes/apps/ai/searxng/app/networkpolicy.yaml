---
# The JSON API has no authentication — SearXNG's secret_key signs its own
# tokens, it does not gate callers. So reachability is the access control, and
# only hearthfetch has any business searching.
#
# Egress is deliberately unrestricted: the whole job is querying public search
# engines, and an allowlist of Google/DuckDuckGo/Brave address space would be
# wrong within a week.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-hearthfetch-only
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hearthfetch
            k8s:io.kubernetes.pod.namespace: ai
    # kubelet probes arrive from the node, not from an endpoint.
    - fromEntities:
        - host
        - remote-node
