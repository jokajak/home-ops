---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# SearXNG's whole settings file, not just a credential.
#
# It lives here rather than in a ConfigMap because `server.secret_key` has to
# be interpolated into it, and a ConfigMap would put that key in git. The
# settings themselves are still plaintext-in-git and reviewable below; only the
# key is injected.
#
# secret_key signs the tokens SearXNG uses to defend its own endpoints. It is
# NOT an API key: nothing authenticates *to* SearXNG with it, and the JSON API
# is open to anything that can reach the pod. Reachability is the access
# control here — see networkpolicy.yaml. Rotating it is harmless; there is no
# persistent state to invalidate.
#
# Owner action: create Bitwarden item "searxng credentials" with a `secret_key`
# field, value from `openssl rand -hex 32`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: searxng-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        settings.yml: |
          use_default_settings: true

          server:
            secret_key: "{{ .secret_key }}"
            # No rate limiter. It needs Valkey/Redis, and the only client is
            # hearthfetch inside the cluster — a bot filter in front of one
            # known consumer is machinery guarding nothing.
            limiter: false
            public_instance: false
            image_proxy: false

          search:
            # ⚠️ THE REASON THIS EXISTS. SearXNG's JSON API is off by default,
            # and requesting an unset format returns 403 rather than an error
            # that explains itself. hearthfetch calls /search?q=…&format=json.
            formats:
              - html
              - json
            safe_search: 0
            autocomplete: ""

          ui:
            static_use_hash: true

          # A deliberately small set. Every engine is a third party seeing the
          # household's queries, and a long tail of flaky ones mostly produces
          # slow searches and partial results.
          engines:
            - name: google
              disabled: false
            - name: duckduckgo
              disabled: false
            - name: brave
              disabled: false
            - name: wikipedia
              disabled: false
  refreshInterval: 1h
  data:
    - secretKey: secret_key
      remoteRef:
        key: searxng credentials
        property: secret_key
