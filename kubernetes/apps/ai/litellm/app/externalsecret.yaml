---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# LiteLLM proxy credentials.
#
# ⚠️ LITELLM_SALT_KEY CANNOT BE ROTATED. It encrypts every provider credential
# stored in the LiteLLM database; changing it makes them permanently unreadable.
# Generate it once (`openssl rand -hex 32`), store it in Bitwarden, never touch it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        LITELLM_SALT_KEY: "{{ .salt_key }}"
        UI_USERNAME: "{{ .ui_username }}"
        UI_PASSWORD: "{{ .ui_password }}"
        # The household's only upstream model credential. It lives here and
        # nowhere else — the agents authenticate to LiteLLM with virtual keys
        # and never see this value.
        ANTHROPIC_API_KEY: "{{ .anthropic_api_key }}"
  refreshInterval: 1h
  data:
    - secretKey: master_key
      remoteRef:
        key: litellm credentials
        property: master_key
    - secretKey: salt_key
      remoteRef:
        key: litellm credentials
        property: salt_key
    - secretKey: ui_username
      remoteRef:
        key: litellm credentials
        property: ui_username
    - secretKey: ui_password
      remoteRef:
        key: litellm credentials
        property: ui_password
    - secretKey: anthropic_api_key
      remoteRef:
        key: anthropic api
        property: api_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# MinIO S3 credentials for the shared `databases` bucket, consumed by the CNPG
# barman-cloud ObjectStore (terraform/minio -> minio-tf-databases).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-litellm-pgsql
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        minio_s3_access_key: |-
          {{ .minio_user }}
        minio_s3_secret_access_key: |-
          {{ .minio_secret }}
  refreshInterval: 15m
  data:
    - secretKey: minio_user
      remoteRef:
        key: minio-tf-databases
        property: username
    - secretKey: minio_secret
      remoteRef:
        key: minio-tf-databases
        property: password
