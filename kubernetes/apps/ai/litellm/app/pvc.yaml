---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/persistentvolumeclaim-v1.json
# Holds the ChatGPT OAuth token (CHATGPT_TOKEN_DIR). Without it every pod
# restart would need a fresh device-code login, which is interactive — exactly
# the thing a GitOps deployment must not require on every reschedule.
#
# Deliberately NOT enrolled in VolSync, unlike the agents' volumes: the only
# thing here is a token that is regenerated by logging in again. Losing it
# costs two minutes, not data. Backing it up would mean replicating a live
# credential to MinIO for no recovery benefit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-token
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  storageClassName: openebs-hostpath
