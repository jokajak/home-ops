---
# Bespoke rather than the shared templates/gatus/guarded ConfigMap: that one
# probes `/` and asserts 200, and LiteLLM's useful unauthenticated endpoint is
# /health/liveliness. Same two checks otherwise — DNS must not resolve outside,
# and the service must answer inside.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-gatus-ep
  namespace: ai
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "litellm Exposure"
        group: internal-guarded
        url: 1.1.1.1
        interval: 1m
        ui:
          hide-hostname: true
          hide-url: true
        dns:
          query-name: "llm.${SECRET_DOMAIN:=internal}"
          query-type: A
        conditions:
          - "len([BODY]) == 0"
      - name: "litellm"
        group: internal
        url: "https://llm.${SECRET_DOMAIN:=internal}/health/liveliness"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
