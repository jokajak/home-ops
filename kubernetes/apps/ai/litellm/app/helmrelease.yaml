---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ai
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # amd64 only. The registry manifest for this tag ADVERTISES linux/arm64,
      # so the pull succeeds and then the binary will not run:
      #
      #   app  exec docker/prod_entrypoint.sh: exec format error
      #
      # That is a broken multi-arch manifest, not a missing image — which is
      # exactly why this pin has to stay. Anyone checking `docker manifest
      # inspect` later will see arm64 listed and conclude the selector is
      # redundant. It is not; this cluster has arm64 nodes (two RPi4s) and the
      # scheduler will happily place it there again.
      #
      # Pinned at pod level rather than per-container so the init container is
      # covered too, regardless of which image turns out to be at fault.
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Creates the litellm database and role on the shared cluster if they
          # are not there yet, then does nothing on every subsequent start. Same
          # image and same contract authentik uses — see the plan doc for why
          # this replaced a dedicated CNPG cluster.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom:
              - secretRef:
                  name: litellm-secret
        containers:
          app:
            # The `-database` variant bundles Prisma and applies its own schema
            # migrations at startup, so no separate migration Job is needed.
            # Plain version tag, not "-stable": BerriAI's -stable channel is
            # stuck at v1.83.14 as of 2026-09, so this deliberately trades their
            # extra testing pass for staying current. Renovate's default docker
            # versioning has no suffix to lock to now, so it tracks future plain
            # releases automatically.
            image:
              repository: ghcr.io/berriai/litellm-database
              tag: v1.99.1
            args: ["--config", "/config/config.yaml", "--port", "4000"]
            env:
              # DATABASE_URL is assembled in the ExternalSecret and arrives via
              # envFrom below, pointing at the shared database/postgres cluster.
              STORE_MODEL_IN_DB: "True"
              # Where the chatgpt/ provider caches its OAuth token. Points at
              # the PVC so the one-time device-code login survives restarts.
              CHATGPT_TOKEN_DIR: /token
            envFrom:
              - secretRef:
                  name: litellm-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # Note the spelling — upstream's endpoint is "liveliness".
                    # Process-only check, no dependency probing.
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # Includes database connectivity.
                    path: /health/readiness
                    port: 4000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  # First boot runs Prisma migrations against an empty database.
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: mdi:router-network
        hosts:
          - host: &host "llm.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        type: configMap
        name: litellm-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      token:
        existingClaim: litellm-token
        globalMounts:
          - path: /token
