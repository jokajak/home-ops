---
# The router's model catalogue.
#
# Backed by a ChatGPT subscription rather than a metered API key: LiteLLM's
# first-party `chatgpt/` provider authenticates over OAuth device code and
# reuses the token from CHATGPT_TOKEN_DIR. This is the piece that lets ONE
# subscription serve both agents — LiteLLM holds the single OAuth token, and
# each agent authenticates to LiteLLM with its own virtual key instead.
#
# Adding a model — including a locally served one, or a metered API key later —
# is an edit here and nothing else: neither agent's manifest names a provider.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    # The `chatgpt/` provider is the CODEX backend, not chatgpt.com: it talks to
    # https://chatgpt.com/backend-api/codex using Codex's client id, identifies
    # as originator `codex_cli_rs`, and prepends the Codex CLI system prompt to
    # every request. So the servable set is whatever Codex offers this
    # subscription — not what the ChatGPT app's model picker shows.
    #
    # LiteLLM's price/context map does NOT gate availability: the responses
    # transformation passes `model` straight through with no local validation,
    # so a model absent from the map still works and merely reports zero cost.
    # The map has no `chatgpt/` entries past gpt-5.4-pro and is not worth
    # consulting for this. To see what this route can actually reach, run
    # `/model` in the codex CLI — that list is authoritative.
    #
    # Every entry sets mode: responses because the backend is native to the
    # Responses API and LiteLLM bridges Chat Completions onto it, which is what
    # Open WebUI speaks. Capability flags are set explicitly because LiteLLM
    # carries no `chatgpt/`-prefixed metadata to infer them from.
    model_list:
      # Most capable — complex, demanding work. Only model here that accepts
      # reasoning_effort: max.
      - model_name: gpt-6-astra
        model_info:
          mode: responses
          supports_reasoning: true
          supports_xhigh_reasoning_effort: true
          supports_max_reasoning_effort: true
        litellm_params:
          model: chatgpt/gpt-6-astra
      # Reliable agentic workhorse — the everyday default.
      - model_name: gpt-5.6-sol
        model_info:
          mode: responses
          supports_reasoning: true
          supports_xhigh_reasoning_effort: true
        litellm_params:
          model: chatgpt/gpt-5.6-sol
      # Balanced agentic coding — tool-heavy and code-shaped work.
      - model_name: gpt-5.6-terra
        model_info:
          mode: responses
          supports_reasoning: true
          supports_xhigh_reasoning_effort: true
        litellm_params:
          model: chatgpt/gpt-5.6-terra
      # Fast and affordable — auxiliary tasks: summarisation, context
      # compression, session titles.
      - model_name: gpt-5.6-luna
        model_info:
          mode: responses
          supports_reasoning: true
          supports_xhigh_reasoning_effort: true
        litellm_params:
          model: chatgpt/gpt-5.6-luna
      # Previous generation, kept as a known-good fallback.
      - model_name: gpt-5.5
        model_info:
          mode: responses
          supports_reasoning: true
          supports_xhigh_reasoning_effort: true
        litellm_params:
          model: chatgpt/gpt-5.5
      # Smallest and cheapest — simple, high-volume calls.
      - model_name: gpt-5.4-mini
        model_info:
          mode: responses
          supports_reasoning: true
          supports_xhigh_reasoning_effort: true
        litellm_params:
          model: chatgpt/gpt-5.4-mini

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Virtual keys, budgets and spend live in Postgres, so they survive a pod
      # restart and are not config-as-code. Deliberate: a per-person budget is
      # an operational dial, not a deployment concern.
      store_model_in_db: true
      # Poll model health in the background rather than on every /health call,
      # so probing does not spend subscription quota per scrape.
      background_health_checks: true
      health_check_interval: 300

    litellm_settings:
      # Load-bearing here, not just tidiness: the ChatGPT subscription backend
      # REJECTS max_tokens / max_output_tokens / max_completion_tokens and
      # metadata. Clients send some of those, so without this requests fail.
      drop_params: true
      num_retries: 2
      # Agent turns with large tool payloads are slow; the default is too tight.
      request_timeout: 600
