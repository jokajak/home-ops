---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# rtl_433 reads MQTT_USERNAME/MQTT_PASSWORD straight out of the environment, so
# the broker credential never reaches the HelmRelease or the process argv.
#
# The `iot` account is the shared in-cluster MQTT client seeded into EMQX's
# built-in database -- see the bootstrap CSV in
# kubernetes/apps/home-automation/emqx/app/externalsecret.yaml. The username is
# not a secret; it lives here only so a single envFrom carries both halves.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rtl-433
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: rtl-433-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        MQTT_USERNAME: iot
        MQTT_PASSWORD: "{{ .client_password }}"
  refreshInterval: 1h
  data:
    - secretKey: client_password
      remoteRef:
        key: emqx credentials
        property: user_password
