---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# rtl_433 reads MQTT_USERNAME/MQTT_PASSWORD straight out of the environment, so
# the broker credential never reaches the HelmRelease or the process argv.
#
# Same "mqtt credentials" Bitwarden item the broker itself is seeded from. This
# deliberately does not reuse mosquitto's Secret directly: the two apps are
# separate Flux Kustomizations with separate prune scopes, so each owning its
# own ExternalSecret keeps rtl-433 from losing its credential if mosquitto's
# Kustomization is ever removed or renamed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rtl-433
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: rtl-433-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        MQTT_USERNAME: "{{ .username }}"
        MQTT_PASSWORD: "{{ .password }}"
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: mqtt credentials
        property: username
    - secretKey: password
      remoteRef:
        key: mqtt credentials
        property: password
