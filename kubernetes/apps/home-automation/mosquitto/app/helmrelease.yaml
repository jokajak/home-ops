---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home-automation
spec:
  interval: 30m

  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      mosquitto:
        annotations:
          reloader.stakater.com/auto: "true"

        # The MQTT listener is a hard dependency for rtl-433 and Home Assistant.
        # One at a time -- a rolling update would briefly run two brokers behind
        # one Service and scatter clients across them.
        strategy: Recreate

        initContainers:
          # mosquitto 2.x will not read plaintext passwords, so the password file
          # cannot just be a mounted Secret. Build it here instead: write
          # "user:password" from the ExternalSecret, then hash it in place with
          # mosquitto_passwd -U (argon2id by default).
          #
          # This runs on every pod start, which preserves the property worth
          # having: the file is re-derived from Bitwarden each time, so rotating
          # the password there actually takes effect rather than being frozen
          # into a file written once.
          init-passwd:
            image: &image
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.1.2-alpine
            command:
              - /bin/sh
              - -c
              # chown by *name*, not uid: the image sets no USER, so mosquitto
              # starts as root and drops privileges to its own `mosquitto` user
              # itself. Referencing the name uses whatever uid the image ships
              # rather than hardcoding one here. 0600 matters -- mosquitto
              # refuses to load a world-readable password file.
              - |
                set -eu
                umask 077
                printf '%s:%s\n' "${MQTT_USERNAME}" "${MQTT_PASSWORD}" > /mosquitto/auth/passwd
                mosquitto_passwd -U /mosquitto/auth/passwd
                chown mosquitto:mosquitto /mosquitto/auth/passwd
                chmod 0600 /mosquitto/auth/passwd
                echo "password file built for user ${MQTT_USERNAME}"
            envFrom: &envFrom
              - secretRef:
                  name: mosquitto-secret
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

        containers:
          mosquitto:
            image: *image

            env:
              TZ: ${TIMEZONE:=America/New_York}

            # Not consumed by the broker itself, but keeps the container's
            # Secret reference explicit so Reloader restarts the pod (and so
            # re-runs init-passwd) when the credential changes.
            envFrom: *envFrom

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &mqttPort 1883
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

            securityContext:
              allowPrivilegeEscalation: false
              # Root at entry only: the image's entrypoint fixes ownership under
              # /mosquitto and the broker then drops to its unprivileged user, as
              # it is designed to. Forcing a non-root uid here skips that and
              # leaves the daemon unable to read its own state.
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID"]

            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      mosquitto:
        controller: mosquitto
        ports:
          mqtt:
            port: *mqttPort

    persistence:
      config:
        type: configMap
        name: mosquitto-config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      # Shared between init-passwd and the broker. Never leaves the pod.
      auth:
        type: emptyDir
        globalMounts:
          - path: /mosquitto/auth
