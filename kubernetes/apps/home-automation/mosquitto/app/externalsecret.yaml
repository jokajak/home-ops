---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The single MQTT account, shared by rtl-433 (publisher) and Home Assistant
# (subscriber). Backed by the "mqtt credentials" Bitwarden login item from
# terraform/bitwarden -- a plain login item, so username/password rather than a
# custom field, which is why this uses the bitwarden-login store.
#
# The broker is reachable only inside the cluster and has exactly two clients,
# so one account is proportionate. Splitting them means adding a second item in
# terraform first -- worth doing if anything off-cluster ever connects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: mosquitto-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        MQTT_USERNAME: "{{ .username }}"
        MQTT_PASSWORD: "{{ .password }}"
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: mqtt credentials
        property: username
    - secretKey: password
      remoteRef:
        key: mqtt credentials
        property: password
