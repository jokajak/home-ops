---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Dashboard superuser for https://emqx.${SECRET_DOMAIN}. Backed by the
# "emqx credentials" Bitwarden login item, which terraform/bitwarden has
# provisioned (admin + a generated password) since before a broker existed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx-dashboard
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: emqx-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        EMQX_DASHBOARD__DEFAULT_USERNAME: "{{ .admin_user }}"
        EMQX_DASHBOARD__DEFAULT_PASSWORD: "{{ .admin_password }}"
  refreshInterval: 1h
  data:
    - secretKey: admin_user
      remoteRef:
        key: emqx credentials
        property: username
    - secretKey: admin_password
      remoteRef:
        key: emqx credentials
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# MQTT client credentials, rendered as the CSV that EMQX's built-in-database
# authenticator reads on boot (`bootstrap_type = plain`, so the password column
# is plaintext and EMQX hashes it on import).
#
# One shared `iot` account for both publishers and subscribers: the broker is
# reachable only from inside the cluster, and the "emqx credentials" item
# carries exactly one non-admin secret (`user_password`). Splitting rtl-433 and
# Home Assistant onto separate accounts means adding fields in
# terraform/bitwarden first -- worth doing if anything outside the cluster ever
# gets to connect, unnecessary while nothing does.
#
# `user_password` is a custom field rather than the item's password, hence the
# bitwarden-fields store instead of bitwarden-login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx-bootstrap
  namespace: home-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: emqx-bootstrap-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        users.csv: |
          user_id,password,is_superuser
          iot,{{ .client_password }},false
  refreshInterval: 1h
  data:
    - secretKey: client_password
      remoteRef:
        key: emqx credentials
        property: user_password
