---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
spec:
  interval: 30m
  chart:
    spec:
      chart: kubelet-csr-approver
      version: 1.2.15
      sourceRef:
        kind: HelmRepository
        name: postfinance
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Every node in the cluster must be listed here, or its kubelet serving-cert
    # CSR is never approved (kubelet sets rotate-server-certificates: true, and
    # bypassDnsResolution makes this regex the only gate). A node missing from
    # this list looks healthy but loses kubectl logs/exec and metrics.
    # Kept in sync with talos/topf.yaml.
    providerRegex: ^(basement-dell-sff|basement-lenovo-m910q|basement-rpi4-chocolate|basement-rpi4-peach|foyer-dell-3040|foyer-dell-mff|foyer-hp-800g3)$
    bypassDnsResolution: true
    metrics:
      enable: true
      serviceMonitor:
        enabled: true
