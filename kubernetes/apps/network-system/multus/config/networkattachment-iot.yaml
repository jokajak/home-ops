---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: iot-vlan
spec:
  # master was eth0.50 until 2026-08-16. The Talos multi-doc network migration
  # builds the VLAN on the LinkAliasConfig alias (talos/all/20-link-alias.yaml.tpl,
  # alias ethSel0), so the interface is ethSel0.50 and eth0.50 no longer exists.
  # Verified on foyer-hp-800g3. Nodes that have not had topf applied yet still
  # present eth0.50, so IoT attachment stays broken on those until they migrate.
  # No static route to ${LAN_CIDR}: it made pods reply to node-sourced traffic
  # (kubelet probes) out net1 instead of eth0, black-holing the probes. Pods that
  # need the LAN reach it over eth0 (cluster network).
  config: |
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ethSel0.50",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "range": "${IOT_CIDR:=192.168.1.0/24}",
            "gateway": "${IOT_GATEWAY:=192.168.1.1}",
            "exclude": [
              "${IOT_GATEWAY:=192.168.1.1}/32"
            ]
          }
        },
        {
          "capabilities": { "mac": true },
          "type": "tuning"
        }
      ]
    }
