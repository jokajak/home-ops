---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whereabouts

spec:
  interval: 15m

  chart:
    spec:
      chart: whereabouts-chart
      version: 0.9.3
      sourceRef:
        kind: HelmRepository
        name: k8snetworkplumbingwg
        namespace: network-system

  maxHistory: 2

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    image:
      repository: ghcr.io/k8snetworkplumbingwg/whereabouts
      tag: "v0.9.4"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: "100m"
        memory: "50Mi"
      limits:
        memory: "256Mi"

  # ip-control-loop releases IPs on observed pod deletions, so leaks only happen
  # when a node dies without emitting one — a power cut takes the loop down with
  # the kubelet. Recovery then waits for the periodic sweep, and a pod pinned to
  # a fixed address cannot start until it runs. The chart hardcodes the schedule
  # in its ConfigMap with no value to override, hence the patch.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: whereabouts-whereabouts-chart-config
            patch: |-
              - op: replace
                path: /data/cron-expression
                value: "17 * * * *"
