---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: whereabouts-ip-reconciler
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  # Without these two, a run that never completes blocks every later run
  # indefinitely under Forbid, and missed schedules accumulate until the
  # controller stops scheduling entirely.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: whereabouts-ip-reconciler
          restartPolicy: OnFailure
          containers:
            - name: ip-reconciler
              image: ghcr.io/k8snetworkplumbingwg/whereabouts:v0.9.4
              command:
                - /ip-reconciler
                - -log-level=verbose
              resources:
                requests:
                  cpu: 100m
                  memory: 50Mi
                limits:
                  memory: 128Mi
