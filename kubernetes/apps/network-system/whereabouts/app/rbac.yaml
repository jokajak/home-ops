---
# The chart's own ServiceAccount is created in kube-system, but ks.yaml sets
# targetNamespace: network-system, which Flux applies to every resource in this
# path — so the CronJob cannot reference it. This SA gives the reconciler an
# identity in the namespace it actually lands in, bound to the chart's
# ClusterRole (already grants RW on whereabouts CRs + read on pods/nodes).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whereabouts-ip-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: whereabouts-ip-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: whereabouts-whereabouts-chart
subjects:
  - kind: ServiceAccount
    name: whereabouts-ip-reconciler
    namespace: network-system
