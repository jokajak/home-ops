---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-home-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: home-assistant
  # Flux postBuild substitution is off for this ConfigMap only. Bubble Card's
  # JS templates use dollar-brace syntax, and Flux would rewrite (usually blank)
  # every one of them. Nothing here needs a cluster variable, so turning it off
  # costs nothing and lets YAML pasted from the Bubble editor go in verbatim.
  # If a cluster variable is ever needed here, drop this annotation and escape
  # each JS template with a doubled dollar instead.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  # ---------------------------------------------------------------------------
  # Mounted at /config/packages/home_dashboard.yaml. Same mechanics and naming
  # traps as configmap-air-quality.yaml: package file uses an UNDERSCORE, the
  # dashboard url_path a HYPHEN.
  #
  # Package merging is recursive, so this `lovelace: dashboards:` merges with the
  # air-quality one as long as the dashboard keys differ.
  #
  # Draft: admin-only until the family layout is settled. Entity names follow
  # docs/home-assistant-entity-naming.md.
  # ---------------------------------------------------------------------------
  home_dashboard.yaml: |
    lovelace:
      dashboards:
        home-draft:
          mode: yaml
          filename: dashboards/home-draft.yaml
          title: Home (draft)
          icon: mdi:home
          show_in_sidebar: true
          require_admin: true

    # Dashboard conditions can only test an entity's state, not an attribute
    # (the TV's `source`). These two flatten what the cards need into on/off.
    template:
      - binary_sensor:
          # webOS goes `unavailable`, not just `off`, while the TV sleeps.
          - name: Primary bedroom TV on
            unique_id: primary_bedroom_tv_on
            state: >-
              {{ states('media_player.primary_bedroom_tv') not in ['off', 'unavailable', 'unknown'] }}
          # "Roku" is the input's name in the TV's source_list (webOS uses the
          # CEC device name, not "HDMI n").
          - name: Primary bedroom TV on Roku
            unique_id: primary_bedroom_tv_on_roku
            state: >-
              {{ is_state('binary_sensor.primary_bedroom_tv_on', 'on')
                 and is_state_attr('media_player.primary_bedroom_tv', 'source', 'Roku') }}

  # ---------------------------------------------------------------------------
  # Mounted at /config/dashboards/home-draft.yaml.
  #
  # Home screen is an overview (the owner's Mushroom room grid); tapping a room
  # with a pop-up opens its Bubble detail view. Context rules are
  # deliberately few and predictable -- what's on screen follows what the TV is
  # physically doing.
  #
  # Bubble `styles:` JS templates are fine here: substitution is disabled on
  # this ConfigMap (see the annotation above).
  # ---------------------------------------------------------------------------
  dashboard.yaml: |
    views:
      - title: Home
        path: home
        icon: mdi:home
        type: sections
        # Overview first, detail on demand: the home screen is a compact Mushroom
        # grid (the owner's existing layout), and a room card opens that room's Bubble
        # pop-up. Only rooms with a pop-up navigate; the rest keep Mushroom's default
        # tap until theirs exist.
        header:
          layout: center
          badges_position: top
          badges_wrap: scroll
        badges:
          - type: entity
            entity: person.josh
            show_name: true
            show_state: true
            show_icon: true
          - type: entity
            entity: person.emily
            show_name: true
            show_state: true
            show_icon: true
          - type: entity
            entity: person.oliver
            show_name: true
            show_state: true
            show_icon: true
        sections:
          # --- Today ---------------------------------------------------------------
          - type: grid
            cards:
              - type: heading
                heading_style: title
              - type: custom:clock-weather-card
                entity: weather.forecast_home
              - type: custom:mushroom-template-card
                entity: cover.car_garage_door
                area: garage
                primary: Car Garage Door
                secondary: '{{ states("cover.car_garage_door") }}'
                features_position: bottom
                icon: |-
                  {% set s = states("cover.car_garage_door") %}
                  {% if s == "closed" %}mdi:garage
                  {% elif s in ["opening", "closing"] %}mdi:garage-alert
                  {% elif s == "open" %}mdi:garage-open
                  {% else %}mdi:alert{% endif %}
                color: |-
                  {% set s = states("cover.car_garage_door") %}
                  {% if s == "closed" %}green
                  {% elif s == "open" %}orange
                  {% elif s in ["opening", "closing"] %}yellow
                  {% else %}red{% endif %}
                badge_icon: >-
                  {% if is_state("binary_sensor.screek_hs_l12_22cbec_presence", "on") %}mdi:motion-sensor{% endif %}
                badge_color: red
              - type: custom:mushroom-template-card
                entity: cover.van_garage_door
                area: garage
                primary: Van Garage Door
                secondary: '{{ states("cover.van_garage_door") }}'
                features_position: bottom
                icon: |-
                  {% set s = states("cover.van_garage_door") %}
                  {% if s == "closed" %}mdi:garage
                  {% elif s in ["opening", "closing"] %}mdi:garage-alert
                  {% elif s == "open" %}mdi:garage-open
                  {% else %}mdi:alert{% endif %}
                color: |-
                  {% set s = states("cover.van_garage_door") %}
                  {% if s == "closed" %}green
                  {% elif s == "open" %}orange
                  {% elif s in ["opening", "closing"] %}yellow
                  {% else %}red{% endif %}
                badge_icon: >-
                  {% if is_state("binary_sensor.screek_hs_l12_22cbec_presence", "on") %}mdi:motion-sensor{% endif %}
                badge_color: red

          # --- Rooms ---------------------------------------------------------------
          # Card: icon colour = lights on; icon tap = everything in the room off;
          # card tap = the room's pop-up (where one exists).
          - type: grid
            cards:
              - type: heading
                heading_style: title
                heading: Rooms
              # The meter is portable (see naming doc) -- move the readings if it
              # leaves the bedroom.
              - type: custom:mushroom-template-card
                area: primary_bedroom
                icon: mdi:bed-king-outline
                primary: |-
                  {% if is_state("input_boolean.primary_bedroom_override", "on") %}Primary Bedroom (off){% else %}Primary Bedroom{% endif %}
                secondary: >-
                  {{ states('sensor.air_quality_meter_temperature', with_unit=True) }}
                  {{ states('sensor.air_quality_meter_humidity', with_unit=True) }}
                multiline_secondary: false
                features_position: bottom
                color: |-
                  {% if is_state("light.primary_bedroom_lights", "on") %}orange{% else %}disabled{% endif %}
                badge_icon: >-
                  {% if is_state("binary_sensor.primary_bedroom_screek_hs_l12_presence", "on") %}mdi:motion-sensor{% endif %}
                grid_options:
                  columns: 6
                  rows: 1
                tap_action:
                  action: navigate
                  navigation_path: "#primary-bedroom"
                icon_tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    area_id: primary_bedroom
              # Temperature from the Dyson's climate entity: the old
              # sensor.fan_office_temperature went away in the rename.
              - type: custom:mushroom-template-card
                area: office
                icon: phu:rooms-office
                primary: |-
                  {% if is_state("input_boolean.office_override", "on") %}Office (off){% else %}Office{% endif %}
                secondary: >-
                  {{ state_attr('climate.office_fan', 'current_temperature') }} °F
                  {{ states('sensor.office_humidity', with_unit=True) }}
                multiline_secondary: false
                features_position: bottom
                color: |-
                  {% if is_state("light.office_lights", "on") %}orange{% else %}grey{% endif %}
                badge_icon: |-
                  {% if is_state("switch.office_desk", "on") %}mdi:power-plug
                  {% elif is_state("binary_sensor.office_motion", "on") %}mdi:motion-sensor
                  {% elif is_state("binary_sensor.office_occupied", "on") %}mdi:abacus
                  {% endif %}
                badge_color: |-
                  {% if is_state("binary_sensor.office_occupied", "on") %}green
                  {% elif is_state("switch.office_desk", "on") %}yellow
                  {% elif is_state("binary_sensor.office_motion", "on") %}red
                  {% endif %}
                grid_options:
                  columns: 6
                  rows: 1
                icon_tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: light.office_lights
              - type: custom:mushroom-template-card
                area: playroom
                primary: Playroom
                icon: |-
                  {% if is_state('media_player.playroom_tv', 'on') %}mdi:television-ambient-light{% else %}mdi:television-off{% endif %}
                color: |-
                  {% if is_state("light.playroom_lights", "on") %}orange{% else %}grey{% endif %}
                multiline_secondary: false
                features_position: bottom
                icon_tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: light.playroom_lights
              - type: custom:mushroom-template-card
                area: guest_room
                primary: Guest Room
                icon: mdi:bed-empty
                features_position: bottom
              - type: custom:mushroom-template-card
                area: o_bedroom
                primary: O Bedroom
                icon: mdi:bed-empty
                # TODO(owner): this reads the PRIMARY bedroom's humidity (copied from
                # the old dashboard). Point it at O Bedroom's own sensor or drop it.
                secondary: "{{ states('sensor.primary_bedroom_humidity', with_unit=True) }}"
                features_position: bottom
                color: |-
                  {% if is_state("light.oliver_bedroom_lights", "on") %}orange{% else %}disabled{% endif %}
              - type: custom:mushroom-template-card
                area: f_bedroom
                primary: F Bedroom
                icon: mdi:bed-empty
                secondary: "{{ states('sensor.girl_humidifier_humidity', with_unit=True) }}"
                features_position: bottom
              - type: custom:mushroom-template-card
                area: sunroom
                primary: Sunroom
                icon: mdi:table-chair
                secondary: >-
                  {{ states('sensor.my_weather_station_inside_temperature', with_unit=True) }}
                  {{ states('sensor.my_weather_station_humidity_indoor', with_unit=True) }}
                features_position: bottom
              - type: custom:mushroom-template-card
                primary: Kitchen
                icon: mdi:stove
                features_position: bottom
                color: |-
                  {% if is_state("light.kitchen_lights", "on") %}orange{% else %}grey{% endif %}
                badge_icon: >-
                  {% if is_state("binary_sensor.apollo_mtr_1_2fb068_ld2450_presence", "on") %}mdi:motion-sensor{% endif %}
                icon_tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    area_id: kitchen
              - type: custom:mushroom-template-card
                primary: Basement
                icon: mdi:television
                features_position: bottom
              - type: custom:mushroom-template-card
                area: foyer
                primary: Foyer
                icon: mdi:chandelier
                features_position: bottom
                color: |-
                  {% if is_state("light.foyer_lights", "on") %}orange{% else %}grey{% endif %}
                tap_action:
                  action: more-info
                icon_tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    area_id: foyer
              # Whole-floor thermostats, controllable in place. Tap opens the Climate
              # pop-up, which also has the playroom AC and the office Dyson.
              - type: custom:mushroom-climate-card
                entity: climate.upstairs_hvac
                name: Upstairs
                primary_info: name
                secondary_info: state
                icon_type: icon
                fill_container: false
                show_temperature_control: true
                collapsible_controls: false
                tap_action:
                  action: navigate
                  navigation_path: "#climate"
              - type: custom:mushroom-climate-card
                entity: climate.downstairs_hvac
                name: Downstairs
                secondary_info: state
                fill_container: false
                show_temperature_control: true
                tap_action:
                  action: navigate
                  navigation_path: "#climate"

          # --- Media ---------------------------------------------------------------
          - type: grid
            cards:
              - type: heading
                heading: Media
                heading_style: title
              - type: entities
                entities:
                  - entity: media_player.playroom_tv
                  - entity: media_player.pr_4k_stick
                  - entity: media_player.primary_bedroom_tv
                  - entity: media_player.primary_bedroom_roku
                  - entity: media_player.porch_tv
                  - entity: media_player.porch_roku
                  - entity: media_player.basement_streaming_stick

          # --- Cameras -------------------------------------------------------------
          - type: grid
            cards:
              - type: heading
                heading_style: title
              - type: picture-entity
                entity: camera.garage_camera
                show_state: false
                show_name: true
                camera_view: auto
                fit_mode: cover
              - type: picture-entity
                entity: camera.dining_camera
                show_state: false
                show_name: true
                camera_view: auto
                fit_mode: cover
                tap_action:
                  action: more-info

          # --- Pop-ups ---------------------------------------------------------
          # Bubble pop-ups render nothing in place; they only need to be on the
          # view. Kept in their own section so the grid above stays readable.
          - type: grid
            cards:
            # --- Primary bedroom pop-up---------------------------------------------
            - type: custom:bubble-card
              card_type: pop-up
              hash: "#primary-bedroom"
              name: Primary Bedroom
              icon: mdi:bed-king
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Lights
                  icon: mdi:lightbulb-group
                # Main tap = both lamps; sub-buttons = one side each.
                - type: custom:bubble-card
                  card_type: button
                  button_type: switch
                  entity: light.primary_bedroom_lamps
                  name: Lamps
                  icon: mdi:lamp
                  sub_button:
                    - entity: light.primary_bedroom_lamp_emily
                      name: Emily
                      show_name: true
                      show_background: true
                      tap_action:
                        action: toggle
                    - entity: light.primary_bedroom_lamp_josh
                      name: Josh
                      show_name: true
                      show_background: true
                      tap_action:
                        action: toggle
                - type: custom:bubble-card
                  card_type: button
                  button_type: switch
                  entity: light.primary_bedroom_fan_light
                  name: Fan light
                  icon: mdi:ceiling-fan-light
                - type: custom:bubble-card
                  card_type: button
                  button_type: switch
                  entity: fan.primary_bedroom_fan
                  name: Fan
                  icon: mdi:ceiling-fan

                - type: custom:bubble-card
                  card_type: separator
                  name: TV
                  icon: mdi:television

                # TV off: one button. It presses the WoL button directly rather
                # than media_player.turn_on, because HA skips service calls to
                # entities that are `unavailable` -- which is this TV asleep.
                - type: conditional
                  conditions:
                    - condition: state
                      entity: binary_sensor.primary_bedroom_tv_on
                      state: "off"
                  card:
                    type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Watch TV
                    icon: mdi:television
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: button.primary_bedroom_tv_wake

                # TV on: inputs, then power + volume, then Roku-only controls.
                - type: conditional
                  conditions:
                    - condition: state
                      entity: binary_sensor.primary_bedroom_tv_on
                      state: "on"
                  card:
                    type: vertical-stack
                    cards:
                      # Active input lights up. "Roku" / "PS5" are the names in
                      # the TV's source_list -- exact spelling matters.
                      - type: horizontal-stack
                        cards:
                          - type: custom:bubble-card
                            card_type: button
                            button_type: name
                            name: Roku
                            icon: mdi:television-play
                            tap_action:
                              action: perform-action
                              perform_action: media_player.select_source
                              target:
                                entity_id: media_player.primary_bedroom_tv
                              data:
                                source: Roku
                            # Lit while the TV is on this input. The template
                            # reads the TV, not this card (which has no entity).
                            styles: |
                              .bubble-button-card-container {
                                background: ${hass.states['media_player.primary_bedroom_tv']?.attributes?.source === 'Roku'
                                  ? 'rgba(156, 39, 176, 0.35)' : 'var(--bubble-button-main-background-color)'} !important;
                              }
                              .bubble-icon {
                                color: ${hass.states['media_player.primary_bedroom_tv']?.attributes?.source === 'Roku'
                                  ? 'rgb(156, 39, 176)' : 'var(--secondary-text-color)'} !important;
                              }
                          - type: custom:bubble-card
                            card_type: button
                            button_type: name
                            name: PlayStation
                            icon: mdi:sony-playstation
                            tap_action:
                              action: perform-action
                              perform_action: media_player.select_source
                              target:
                                entity_id: media_player.primary_bedroom_tv
                              data:
                                source: PS5
                            # Lit while the TV is on this input. The template
                            # reads the TV, not this card (which has no entity).
                            styles: |
                              .bubble-button-card-container {
                                background: ${hass.states['media_player.primary_bedroom_tv']?.attributes?.source === 'PS5'
                                  ? 'rgba(33, 150, 243, 0.35)' : 'var(--bubble-button-main-background-color)'} !important;
                              }
                              .bubble-icon {
                                color: ${hass.states['media_player.primary_bedroom_tv']?.attributes?.source === 'PS5'
                                  ? 'rgb(33, 150, 243)' : 'var(--secondary-text-color)'} !important;
                              }
                      # Power and volume always come from the TV, whatever the input.
                      - type: custom:bubble-card
                        card_type: media-player
                        entity: media_player.primary_bedroom_tv
                        name: TV
                        icon: mdi:television
                        hide:
                          play_pause_button: true
                          previous_button: true
                          next_button: true
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: binary_sensor.primary_bedroom_tv_on_roku
                            state: "on"
                        card:
                          type: custom:bubble-card
                          card_type: media-player
                          entity: media_player.primary_bedroom_roku
                          name: Roku
                          icon: mdi:television-play
                          hide:
                            power_button: true
                            volume_button: true
                          sub_button:
                            - icon: mdi:remote
                              name: Remote
                              show_name: true
                              tap_action:
                                action: navigate
                                navigation_path: "#primary-bedroom-remote"

            # --- Primary bedroom Roku remote pop-up---------------------------------
            # Kept off the main pop-up so the everyday screen stays short.
            - type: custom:bubble-card
              card_type: pop-up
              hash: "#primary-bedroom-remote"
              name: Primary Bedroom Roku
              icon: mdi:remote
              cards:
                - type: horizontal-stack
                  cards:
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Back
                      icon: mdi:arrow-left
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: back
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Up
                      icon: mdi:chevron-up
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: up
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Home
                      icon: mdi:home
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: home
                - type: horizontal-stack
                  cards:
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Left
                      icon: mdi:chevron-left
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: left
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: OK
                      icon: mdi:circle-medium
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: select
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Right
                      icon: mdi:chevron-right
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: right
                - type: horizontal-stack
                  cards:
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Rewind
                      icon: mdi:rewind
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: reverse
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Down
                      icon: mdi:chevron-down
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: down
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Forward
                      icon: mdi:fast-forward
                      tap_action:
                        action: perform-action
                        perform_action: remote.send_command
                        target:
                          entity_id: remote.primary_bedroom_roku
                        data:
                          command: forward

            # --- Climate pop-up --------------------------------------------------
            # Each card: current temp, setpoint -/+, and a mode menu.
            - type: custom:bubble-card
              card_type: pop-up
              hash: "#climate"
              name: Climate
              icon: mdi:thermostat
              cards:
                - type: custom:bubble-card
                  card_type: climate
                  entity: climate.upstairs_hvac
                  name: Upstairs
                  icon: mdi:home-floor-1
                  sub_button:
                    - name: Mode
                      select_attribute: hvac_modes
                      show_arrow: false
                      state_background: false
                - type: custom:bubble-card
                  card_type: climate
                  entity: climate.downstairs_hvac
                  name: Downstairs
                  icon: mdi:home-floor-0
                  sub_button:
                    - name: Mode
                      select_attribute: hvac_modes
                      show_arrow: false
                      state_background: false
                # Seasonal: the window AC is unplugged in winter, so its card only
                # appears while the entity is reachable.
                - type: conditional
                  conditions:
                    - condition: state
                      entity: climate.playroom_ac
                      state_not: unavailable
                  card:
                    type: custom:bubble-card
                    card_type: climate
                    entity: climate.playroom_ac
                    name: Playroom AC
                    icon: mdi:air-conditioner
                    sub_button:
                      - name: Mode
                        select_attribute: hvac_modes
                        show_arrow: false
                        state_background: false
                - type: custom:bubble-card
                  card_type: climate
                  entity: climate.office_fan
                  name: Office fan
                  icon: mdi:fan
                  sub_button:
                    - name: Mode
                      select_attribute: hvac_modes
                      show_arrow: false
                      state_background: false
