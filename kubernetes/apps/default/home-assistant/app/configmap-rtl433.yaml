---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-rtl433
  namespace: default
  labels:
    app.kubernetes.io/name: home-assistant
data:
  # Mounted at /config/packages/rtl433.yaml; picked up via
  # `homeassistant: packages: !include_dir_named packages` in configuration.yaml.
  #
  # NOTE: this file defines MQTT *entities* only. The broker *connection* is a
  # config entry, not YAML -- Home Assistant dropped `mqtt: broker:` in 2022.6 --
  # so it has to be added once through the UI. That is a real gap against the
  # everything-as-code rule; see docs/plans/2026-08-31-rtl433-sdr-security-sensors.md.
  rtl433.yaml: |
    mqtt:
      sensor:
        # Discovery aid, not a real sensor. rtl_433 publishes every decode as
        # JSON to rtl_433/events; this surfaces the most recent one, with the
        # full payload as entity attributes. Trip a sensor, look at this entity
        # in Developer Tools -> States, and read off the `id` you need below.
        # (`kubectl -n home-automation logs deploy/rtl-433 -f` shows the same
        # stream if you would rather watch it from a terminal.)
        - name: "rtl_433 last event"
          unique_id: rtl_433_last_event
          state_topic: "rtl_433/events"
          value_template: >-
            {{ value_json.model | default('?') }}/{{ value_json.subtype | default('-') }}/{{ value_json.id | default('?') }}
          json_attributes_topic: "rtl_433/events"
          icon: mdi:radio-tower
          availability:
            - topic: "rtl_433/availability"

      # ----------------------------------------------------------------------
      # One sensor, worked through. Copy the block per physical sensor, replace
      # 1a2b3c with the id from the discovery sensor above, rename it, and pick
      # the right device_class (door / window / motion / smoke / gas).
      #
      # Topics come from rtl-433's `devices=` format string:
      #   rtl_433/devices/<model>/<subtype>/<id>/<field>
      # so an Interlogix door contact publishes
      #   rtl_433/devices/Interlogix-Security/contact/1a2b3c/switch1
      #
      # Which switch is which, per the decoder (patent US5761206):
      #   switch1  primary trigger -- the reed on a contact, PIR on a motion
      #   switch2  external contact loop (wired sensor on the terminals)
      #   switch3  cover/case tamper
      #   switch4  spare
      #   switch5  supervisory
      # Values are the literal strings OPEN and CLOSED. battery_ok is 1/0.
      #
      # `expire_after` is the point of doing this at all for security sensors:
      # these transmit a supervisory heartbeat roughly hourly, so three hours of
      # silence means a dead battery, a dead sensor, or someone jamming it --
      # and the entity goes `unavailable` instead of sitting on a stale
      # "CLOSED" forever. Stretch it if you see false unavailables.
      # ----------------------------------------------------------------------
      # binary_sensor:
      #   - name: "Front door"
      #     unique_id: interlogix_1a2b3c_contact
      #     state_topic: "rtl_433/devices/Interlogix-Security/contact/1a2b3c/switch1"
      #     payload_on: "OPEN"
      #     payload_off: "CLOSED"
      #     device_class: door
      #     expire_after: 10800
      #     availability:
      #       - topic: "rtl_433/availability"
      #     device: &front_door
      #       identifiers: ["interlogix_1a2b3c"]
      #       name: "Front door sensor"
      #       manufacturer: "Interlogix"
      #       model: "Wireless contact (319.5 MHz)"

      #   - name: "Front door tamper"
      #     unique_id: interlogix_1a2b3c_tamper
      #     state_topic: "rtl_433/devices/Interlogix-Security/contact/1a2b3c/switch3"
      #     payload_on: "OPEN"
      #     payload_off: "CLOSED"
      #     device_class: tamper
      #     expire_after: 10800
      #     availability:
      #       - topic: "rtl_433/availability"
      #     device: *front_door

      #   - name: "Front door battery"
      #     unique_id: interlogix_1a2b3c_battery
      #     state_topic: "rtl_433/devices/Interlogix-Security/contact/1a2b3c/battery_ok"
      #     # device_class battery is inverted by convention: on == low.
      #     payload_on: "0"
      #     payload_off: "1"
      #     device_class: battery
      #     entity_category: diagnostic
      #     expire_after: 10800
      #     availability:
      #       - topic: "rtl_433/availability"
      #     device: *front_door
