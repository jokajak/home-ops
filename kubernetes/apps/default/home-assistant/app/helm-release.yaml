---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.3
            env:
              TZ: America/New_York
              HASS_HTTP_TRUSTED_PROXY_1: ${SERVICE_CIDR:=127.0.0.1}
              HASS_HTTP_TRUSTED_PROXY_2: ${NODE_CIDR:=10.0.0.0/8}
              # Move the venv off /config onto an emptyDir so it is rebuilt every start.
              # The image runs `uv venv --system-site-packages --allow-existing`, which
              # reuses whatever is already there -- so a venv on /config freezes while the
              # image moves on. That is exactly what happened: aiohttp 3.13.5 sat there
              # since 2025-04 shadowing the image's 3.14.3, and the 2026.7.4 upgrade broke
              # websocket_api and every Bluetooth integration.
              VENV_FOLDER: /venv
              # Rebuilding each boot is only cheap if uv can reuse wheels; the image sets
              # UV_NO_CACHE=true, so override it. The cache is on NFS, not hostpath, so it
              # survives pod restarts and follows the pod between nodes.
              UV_NO_CACHE: "false"
              UV_CACHE_DIR: /uv-cache
              # Recorder -> CNPG Postgres; full URI is auto-generated by CNPG.
              # Referenced from packages/recorder.yaml via !env_var RECORDER_DB_URL.
              RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-db-app
                    key: uri
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
          affinity:
            nodeAffinity:
              # only schedule on nodes with the zwave label
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
          annotations:
            # printf '02:00:00:%02X:%02X:%02X\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256))
            # 02 indicates a locally administered address
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                "name":"iot-vlan",
                "interface": "eth0.50",
                "namespace": "network-system",
                "mac": "02:00:00:B5:46:C4"
                }
              ]
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          hajimari.io/icon: "vscode-icons:file-type-homeassistant"
        hosts:
          - host: &host "home.${SECRET_DOMAIN:=internal}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: wildcard-cert-tls
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      recorder-config:
        type: configMap
        name: home-assistant-recorder
        globalMounts:
          - path: /config/packages/recorder.yaml
            subPath: recorder.yaml
            readOnly: true
      # MQTT entities for the 319.5 MHz Interlogix security sensors received by
      # rtl-433 in the home-automation namespace. Entities only -- the broker
      # connection itself is a UI-created config entry, see the ConfigMap.
      rtl433-config:
        type: configMap
        name: home-assistant-rtl433
        globalMounts:
          - path: /config/packages/rtl433.yaml
            subPath: rtl433.yaml
            readOnly: true
      # Scrape sensors for the Atlanta Allergy & Asthma counting station -- the
      # data behind the panel below.
      pollen-config:
        type: configMap
        name: home-assistant-pollen
        globalMounts:
          - path: /config/packages/pollen.yaml
            subPath: pollen.yaml
            readOnly: true
      # Pollen/mold panel. Two mounts off one ConfigMap: the package registers the
      # dashboard with Lovelace, the dashboard file holds the cards. Both have to
      # be on disk before HA starts -- a YAML dashboard is read at setup, not on
      # demand -- so neither can live in .storage.
      air-quality-config:
        type: configMap
        name: home-assistant-air-quality
        globalMounts:
          - path: /config/packages/air-quality.yaml
            subPath: air-quality.yaml
            readOnly: true
          - path: /config/dashboards/air-quality.yaml
            subPath: dashboard.yaml
            readOnly: true
      # Ephemeral by design -- a fresh venv every pod start is the whole point.
      venv:
        type: emptyDir
        globalMounts:
          - path: /venv
      # Wheel cache for the above. Deliberately not retained: it is regenerable, and
      # deliberately nfs-csi rather than openebs-hostpath, which is node-local and
      # would strand the cache the moment the pod moved nodes.
      uv-cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: nfs-csi
        globalMounts:
          - path: /uv-cache
      tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
