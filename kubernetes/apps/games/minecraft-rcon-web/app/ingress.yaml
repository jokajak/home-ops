---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minecraft-rcon
  namespace: games
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Minecraft RCON
    gethomepage.dev/description: Minecraft server admin
    gethomepage.dev/group: Games
    gethomepage.dev/icon: minecraft.svg
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=minecraft-rcon-web
    external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN:=internal}"
spec:
  ingressClassName: internal
  rules:
    - host: &host "minecraft-rcon.${SECRET_DOMAIN:=internal}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minecraft-rcon
                port:
                  number: 80
  tls:
    - hosts:
        - *host
