---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-agent-sandbox
  namespace: flux-system
spec:
  targetNamespace: agent-sandbox-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: agent-sandbox
  path: ./kubernetes/apps/agent-sandbox-system/agent-sandbox/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # wait: the Sandbox CRD arrives with this release, and cluster-apps-ai-jobs
  # depends on it.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
