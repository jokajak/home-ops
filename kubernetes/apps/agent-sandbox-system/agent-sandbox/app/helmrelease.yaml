---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# agent-sandbox controller, core only. Reconciles `Sandbox`
# (agents.x-k8s.io/v1beta1), the one-pod runs that hearthai's ai-jobs executor
# creates in the ai-jobs namespace. Cluster-scoped by design: it is a
# controller, not a workload in ai-jobs. See
# docs/plans/2026-11-13-hearthai-local-inference.md "Sandbox namespace".
#
# Upgrading: bump `ref.tag` in
# kubernetes/flux/repositories/git/agent-sandbox.yaml
# and `image.tag` below together. The chart's CRDs live in its crds/ directory,
# which Helm never upgrades on its own, hence `crds: CreateReplace`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
spec:
  interval: 30m
  chart:
    spec:
      chart: ./helm
      # The chart version (0.1.4) does not change per upstream release, so
      # follow the source revision, as the hearthai release does.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
        namespace: flux-system
      interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # The namespace is created by ../../namespace.yaml (prune disabled).
    namespace:
      create: false
      name: agent-sandbox-system
    image:
      repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
      tag: v1.0.9
    # Core only: no SandboxTemplate, SandboxWarmPool or SandboxClaim.
    controller:
      extensions: false
    # One replica, so leader election has nothing to elect; the chart's own
    # default is on and harmless, left as is.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
