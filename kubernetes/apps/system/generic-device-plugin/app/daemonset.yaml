---
# generic-device-plugin.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - image: docker.io/squat/generic-device-plugin:0.2.0
          args:
            # Devices are advertised as <domain>/<name>. Upstream's
            # default moved from squat.ai to devic.es; pin it here
            # rather than tracking whatever the default happens to be.
            - --domain
            - devic.es
            - --device
            - |
              name: tun
              groups:
                - count: 1000
                  paths:
                    - path: /dev/net/tun
            # RTL-SDR Blog V3 (RTL2832U + R820T2), used by rtl-433 to receive 319.5 MHz
            # Interlogix security sensors. Advertised as `devic.es/rtl-sdr` and only on the
            # node the dongle is actually plugged into, so requesting the resource is what
            # pins the pod to that node -- no NodeFeatureRule or nodeSelector needed.
            #
            # Each group is matched independently. 0bda:2838 ("RTL2838 DVB-T") is what a V3
            # enumerates as; 0bda:2832 covers older RTL2832U sticks. A group that matches
            # nothing simply contributes no devices, so listing both is free.
            - --device
            - |
              name: rtl-sdr
              groups:
                - usb:
                    - vendor: "0bda"
                      product: "2838"
                - usb:
                    - vendor: "0bda"
                      product: "2832"
          name: generic-device-plugin
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
