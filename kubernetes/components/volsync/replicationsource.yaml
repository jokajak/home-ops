---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}
spec:
  sourcePVC: ${VOLSYNC_CLAIM:=${APP}}
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: ${APP}-volsync-secret
    # nfs-csi has no VolumeSnapshotClass; read the source PVC directly.
    copyMethod: Direct
    cacheCapacity: ${VOLSYNC_CACHE_CAPACITY:=2Gi}
    # NOT openebs-hostpath: that class is node-local (WaitForFirstConsumer + node
    # affinity), while copyMethod Direct pins the mover to whichever node holds the
    # RWO source PVC. When an app pod reschedules, the mover follows it but the cache
    # PV cannot, and the mover is unschedulable forever -- silently, since backups
    # just stop rather than erroring. nfs-csi binds Immediate with no node affinity,
    # so the cache follows the mover anywhere.
    cacheStorageClassName: ${VOLSYNC_CACHE_STORAGECLASS:=nfs-csi}
    pruneIntervalDays: 7
    moverSecurityContext:
      runAsUser: ${VOLSYNC_PUID:=1000}
      runAsGroup: ${VOLSYNC_PGID:=1000}
      fsGroup: ${VOLSYNC_PGID:=1000}
    retain:
      hourly: 24
      daily: 7
