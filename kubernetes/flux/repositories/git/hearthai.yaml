---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
# The hearthai repository, as a Helm chart source.
#
# hearthai packages Open WebUI, LiteLLM, meridian and hearthmem into one chart
# (deploy/charts/hearthai) — it owns the images, probes, config and the version
# compatibility between them. This cluster supplies only site inputs: the
# hostnames, the Secrets, the claims, and the Postgres database. See
# docs/plans/2026-09-10-hearthai-single-release.md.
#
# Pinned to a commit of jokajak/hearthai main, and moved by a reviewed pull
# request. home-ops deploys exactly this commit's deploy/ tree, so a push to
# hearthai does nothing here until the pin moves. reconcileStrategy: Revision in
# the HelmRelease turns each new pin into an upgrade (chart version
# 0.1.0+<sha>).
#
# Renovate's flux manager reads a GitRepository `ref.commit` as a git-refs
# digest and proposes the new head of hearthai's default branch (main) in one
# weekly, non-automerged pull request; see the hearthai rule in
# .github/renovate.json5. Review that diff under deploy/, let flate pass, merge.
# For an urgent fix, edit `commit:` by hand the same day. See "Upgrading" in
# kubernetes/apps/ai/hearthai/README.md.
#
# Moving to an OCIRepository + version range (oci://ghcr.io/jokajak/charts/hearthai)
# once hearthai cuts a tag would replace this pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: hearthai
  namespace: flux-system
spec:
  interval: 30m
  url: "https://github.com/jokajak/hearthai.git"
  ref:
    commit: a4b47f9e4b4050f5f30618bcf92deed58ecb5b05
  ignore: |
    # exclude all
    /*
    # include deploy/ — the chart, its local hearthmem dependency, and the
    # examples. One level, like home-kubernetes' own rule: gitignore semantics
    # cannot re-include a path whose parent directory is excluded, so
    # "!/deploy/charts" on its own would silently produce an empty artifact.
    !/deploy
