---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
# The hearthai repository, as a Helm chart source.
#
# hearthai packages Open WebUI, LiteLLM, meridian and hearthmem into one chart
# (deploy/charts/hearthai) — it owns the images, probes, config and the version
# compatibility between them. This cluster supplies only site inputs: the
# hostnames, the Secrets, the claims, and the Postgres database. See
# docs/plans/2026-09-10-hearthai-single-release.md.
#
# ⚠️ Floating on main, intentionally, while the chart is under active
# development. Every push to jokajak/hearthai main becomes a new source
# revision, and reconcileStrategy: Revision in the HelmRelease turns each one
# into an upgrade (chart version 0.1.0+<sha>) — that is the dev loop: push the
# chart, the cluster follows. The cost is that whatever lands on main deploys
# unreviewed, which is acceptable only because this is a single-household lab
# and the chart's owner is the one pushing. Pin this back to `commit:` (or,
# better, an OCIRepository + version range once hearthai cuts a tag to
# oci://ghcr.io/jokajak/charts/hearthai — which is also what lets Renovate
# track it) as soon as the chart stabilises.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: hearthai
  namespace: flux-system
spec:
  interval: 30m
  url: "https://github.com/jokajak/hearthai.git"
  ref:
    branch: "main"
  ignore: |
    # exclude all
    /*
    # include deploy/ — the chart, its local hearthmem dependency, and the
    # examples. One level, like home-kubernetes' own rule: gitignore semantics
    # cannot re-include a path whose parent directory is excluded, so
    # "!/deploy/charts" on its own would silently produce an empty artifact.
    !/deploy
