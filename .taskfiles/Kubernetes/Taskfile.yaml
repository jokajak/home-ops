---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  FLUX_ROOT: "{{.KUBERNETES_DIR}}/flux/config"

tasks:

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: resource }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      resource: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods

  # Replaces the former kubeconform task. flate covers schema validation and
  # Kustomization/HelmRelease rendering in one pass, and is what CI now runs
  # (.github/workflows/flate.yaml), so this matches CI exactly. FLUX_ROOT is
  # kubernetes/flux/config rather than upstream's kubernetes/flux/cluster -
  # see the comment in that workflow.
  flate:
    aliases: ["kubeconform", "validate"]
    desc: Validate manifests and rendering with flate (same as CI)
    cmd: flate test all -p {{.FLUX_ROOT}} {{.CLI_ARGS}}
    preconditions:
      - { msg: "Missing flate binary", sh: "command -v flate" }
      - { msg: "Missing flux root {{.FLUX_ROOT}}", sh: "test -d {{.FLUX_ROOT}}" }
