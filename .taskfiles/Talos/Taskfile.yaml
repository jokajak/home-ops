---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Talos machine configuration is managed with topf, which reads talos/topf.yaml
# (SOPS-encrypted) plus the patch tree in talos/{all,control-plane,worker,node}.
#
# topf shells out to `sops` to detect and decrypt encrypted inputs. If `sops` is
# not on PATH it silently treats topf.yaml as plaintext and fails with confusing
# YAML parse errors, so every recipe here checks for it up front.

vars:
  TOPF_CONFIG_FILE: "{{.TALOS_DIR}}/topf.yaml"
  TOPF_SECRETS_FILE: "{{.TALOS_DIR}}/secrets.yaml"

env:
  TALOSCONFIG: "{{.TALOS_DIR}}/talosconfig"

tasks:
  nodes:
    desc: List all nodes and their current state
    dir: "{{.TALOS_DIR}}"
    cmd: topf nodes {{.CLI_ARGS}}
    preconditions:
      - &topf { msg: "Missing topf binary", sh: "command -v topf" }
      - &sops { msg: "Missing sops binary (topf needs it to decrypt topf.yaml)", sh: "command -v sops" }
      - &config
        msg: "Missing topf config file"
        sh: "test -f {{.TOPF_CONFIG_FILE}}"

  render:
    desc: Render machine configs locally without touching any node
    dir: "{{.TALOS_DIR}}"
    cmd: topf render --output ./output {{.CLI_ARGS}}
    preconditions: [*topf, *sops, *config]

  diff:
    desc: Show what an apply would change, without applying it (use node=<regex> for one)
    dir: "{{.TALOS_DIR}}"
    # Mirrors `apply`'s --nodes-filter. Without it `node=` was silently ignored,
    # so a dry-run could not be scoped to the node you were about to apply to,
    # and one unreachable node aborted the whole preview.
    cmd: topf apply --dry-run {{if .node}}--nodes-filter {{.node}}{{end}} {{.CLI_ARGS}}
    preconditions: [*topf, *sops, *config]

  apply:
    desc: Apply machine config to every node (use node=<regex> for one)
    prompt: This will apply machine configuration to live nodes... continue?
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --confirm {{if .node}}--nodes-filter {{.node}}{{end}} {{.CLI_ARGS}}
    preconditions: [*topf, *sops, *config]

  upgrade:
    desc: Upgrade Talos on every node (use node=<regex> for one)
    prompt: This will upgrade and reboot Talos nodes... continue?
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade --confirm --drain {{if .node}}--nodes-filter {{.node}}{{end}} {{.CLI_ARGS}}
    preconditions: [*topf, *sops, *config]

  upgrade-k8s:
    desc: Upgrade Kubernetes across the cluster (then bump kubernetesVersion in topf.yaml)
    prompt: This will upgrade Kubernetes... continue?
    # topf has no upgrade-k8s of its own; it defers to talosctl, which does the
    # version-skew and component-readiness checks that `topf apply` skips.
    cmd: talosctl --nodes {{.node}} upgrade-k8s --to {{.to}}
    requires:
      vars: ["node", "to"]

  schematic-ids:
    desc: Show the resolved image factory schematic ID for each node
    dir: "{{.TALOS_DIR}}"
    cmd: topf schematic-ids {{.CLI_ARGS}}
    preconditions: [*topf, *sops, *config]

  talosconfig:
    desc: Generate talosconfig from the secrets bundle
    dir: "{{.TALOS_DIR}}"
    cmd: topf talosconfig
    preconditions:
      - *topf
      - *sops
      - *config
      - { msg: "Missing secrets bundle", sh: "test -f {{.TOPF_SECRETS_FILE}}" }

  kubeconfig:
    desc: Generate a temporary admin kubeconfig
    dir: "{{.TALOS_DIR}}"
    cmd: topf kubeconfig {{.CLI_ARGS}}
    preconditions: [*topf, *sops, *config]

  gensecret:
    desc: Generate a Talos secrets bundle (only when one does not already exist)
    prompt: This creates new cluster PKI. Only ever do this for a brand-new cluster... continue?
    dir: "{{.TALOS_DIR}}"
    # `topf secrets` prints the bundle to stdout, and prints the *existing* one
    # when secrets.yaml is present. Redirecting straight into secrets.yaml would
    # truncate it before topf could read it, destroying the cluster PKI — hence
    # the guard and the temp file.
    cmds:
      - topf secrets > secrets.yaml.tmp
      - mv secrets.yaml.tmp {{.TOPF_SECRETS_FILE}}
      - sops --encrypt --in-place {{.TOPF_SECRETS_FILE}}
    preconditions:
      - *topf
      - *sops
      - msg: "secrets.yaml already exists — refusing to overwrite the cluster PKI"
        sh: "test ! -f {{.TOPF_SECRETS_FILE}}"

  apply-extras:
    desc: Apply extras
    dir: "{{.TALOS_DIR}}"
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG_FILE}} kustomize --enable-helm ./cilium | kubectl apply --kubeconfig {{.KUBECONFIG_FILE}} --server-side --filename -
      - kubectl --kubeconfig {{.KUBECONFIG_FILE}} kustomize --enable-helm ./kubelet-csr-approver | kubectl apply --kubeconfig {{.KUBECONFIG_FILE}} --server-side --filename -
    preconditions:
      - { msg: "Missing kubeconfig", sh: "test -f {{.KUBECONFIG_FILE}}" }
