---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Kubeconform"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]

env:
  KUBERNETES_DIR: ./kubernetes
  KUBECONFORM_VERSION: "0.8.0"
  KUSTOMIZE_VERSION: "5.8.1"
  # Pinned deliberately: flux 2.9.x changed `flux envsubst --strict` so it errors
  # on variables this workflow never supplies (they come from cluster-secrets at
  # reconcile time), failing scripts/kubeconform.sh at
  # kubernetes/apps/networking/nginx/certificates/. Annotated so Renovate raises a
  # visible PR rather than leaving the pin to drift silently — in-cluster flux is
  # already on 2.9.x. Do not merge the bump until --strict is dealt with: supply
  # placeholders here, drop --strict, or move to flate. See docs/ISSUES.md #7.
  # renovate: datasource=github-releases depName=fluxcd/flux2
  FLUX_VERSION: "2.8.8"

jobs:
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Workflow Tools
        run: |
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          # kubeconform
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "${HOME}/.local/bin" kubeconform

          # kustomize
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${HOME}/.local/bin" kustomize

          # flux (for envsubst)
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${HOME}/.local/bin" flux

      - name: Run kubeconform
        shell: bash
        run: bash ./scripts/kubeconform.sh ${{ env.KUBERNETES_DIR }}
