---
creation_rules:
  - # topf cluster + node inventory.
    #
    # Partial encryption: only the address-bearing values are ciphered, so the
    # structure (hostnames, roles, versions, schematic refs) stays reviewable in
    # a diff while no network topology reaches the repo in plaintext.
    #
    # topf parses `ip` and `clusterEndpoint` into typed Go values, so both must
    # be listed here — a partially-encrypted file is decrypted by topf before
    # parsing, but only when the `sops` binary is on PATH.
    path_regex: talos/topf\.yaml
    encrypted_regex: "^(ip|clusterEndpoint|vip|gateway|apiDNS|nodeCIDR|vlanCIDR|nameservers|vlanAddress)$"
    # Versions and inventory metadata are intentionally plaintext. Authenticate
    # only encrypted address values so tools such as Renovate can update those
    # plaintext fields without invalidating the SOPS MAC.
    mac_only_encrypted: true
    key_groups:
      - age:
          - "age1sy27zexxvef2q63aeky2uuhmm0rvrclqf6fzfu2qqe2pc0w6rc8s7fde68"
  - # Talos secrets bundle (cluster PKI). Encrypted whole.
    path_regex: talos/secrets\.yaml
    key_groups:
      - age:
          - "age1sy27zexxvef2q63aeky2uuhmm0rvrclqf6fzfu2qqe2pc0w6rc8s7fde68"
  - path_regex: kubernetes/flux/vars/.*\.ya?ml
    encrypted_regex: "((?i)(displayname|email|pass|ca|id|bootstraptoken|secretboxencryptionsecret|secrets|secrets|password|cert|secret($|[^N])|key|token|^data$|^stringData))"
    key_groups:
      - age:
          - "age1sy27zexxvef2q63aeky2uuhmm0rvrclqf6fzfu2qqe2pc0w6rc8s7fde68"
  - path_regex: kubernetes/.*\.sops\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - "age1sy27zexxvef2q63aeky2uuhmm0rvrclqf6fzfu2qqe2pc0w6rc8s7fde68"
  - # IMPORTANT: encrypt terraform
    path_regex: terraform/.*/.*\.sops\.ya?ml
    key_groups:
      - age:
          - "age1sy27zexxvef2q63aeky2uuhmm0rvrclqf6fzfu2qqe2pc0w6rc8s7fde68"
